      # Pushes to main refresh the shared cache; a pull request saves its own only when
      # nothing was restored, so pull requests do not evict main's entries.
      - name: Save the compiler cache
        if: success() && (github.event_name == 'push' || steps.ccache-restore.outputs.cache-matched-key == '')
        uses: actions/cache/save@v5
        with:
          path: /ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
  package:
    name: Arch package acceptance
    runs-on: ubuntu-latest
    container: mirror.gcr.io/library/archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - name: Install build and software-rendering dependencies
        run: |
          cp packaging/arch/mirrorlist /etc/pacman.d/mirrorlist
          # The pinned archive mirror occasionally stalls; retry the whole sync.
          for attempt in 1 2 3; do
            pacman -Syyuu --noconfirm --needed $CI_PACKAGES && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 30))
          done
      - name: Record toolchain
        run: pacman -Q cmake ninja gcc qt6-base qt6-wayland mesa
      - name: Download the previous release package
        # Public release asset (~10 MiB); no token is needed. verify-package.sh also
        # checks the SHA-256 it pins for this file name.
        run: |
          install -d /work/release
          curl -fsSL --retry 3 -o /work/release/sketchyup-1.0.1-1-x86_64.pkg.tar.zst \
            https://github.com/zygote55/sketchyup/releases/download/v1.0.1/sketchyup-1.0.1-1-x86_64.pkg.tar.zst
          echo '91e807851d40525ce5429814f88b59c4fef9321de121f165e9e33429b82869f5  /work/release/sketchyup-1.0.1-1-x86_64.pkg.tar.zst' | sha256sum -c -
      - name: Disposable Arch package acceptance
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4
          SKETCHYUP_PRIOR_RELEASE_PACKAGE: /work/release/sketchyup-1.0.1-1-x86_64.pkg.tar.zst
        run: |
          useradd --create-home builder
          scripts/package-source.sh /work/package
          cp packaging/arch/verify-package.sh /work/package/
          SKETCHYUP_PACKAGE_SANDBOX=1 bash /work/package/verify-package.sh
