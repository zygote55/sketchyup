          build/dev/sketchyup-cli --input /tmp/profile-sweep.sketchyup
          build/dev/sketchyup-cli --script examples/guides.json --output /tmp/guides.sketchyup
          build/dev/sketchyup-cli --input /tmp/guides.sketchyup --query geometry.inspect --context 1
      - name: Sanitized core without Qt
        run: |
          cmake --preset sanitize
          cmake --build --preset sanitize --parallel 2
          ctest --preset sanitize
      - name: Sanitized bounded inspection and CLI
        run: |
          cmake --preset sanitize -DSKETCHYUP_BUILD_CLI=ON
          cmake --build --preset sanitize --target hosted_command_tests hosted_components_io_tests component_glue_io_tests diagnostic_inspection_tests edge_visibility_tests shading_normals_tests smooth_export_tests edge_command_tests edge_appearance_tests orientation_command_tests solid_command_tests boolean_command_tests intersection_command_tests sweep_command_tests offset_command_tests chatgpt_auth_tests native_assistant_session_tests ollama_provider_tests openai_provider_tests blender_job_tests glb_export_tests model_recipes_tests assistant_tests inspection_tests inspection_session_tests staging_tests outcome_store_tests transaction_coordinator_tests transaction_dispatch_tests automation_session_tests recipe_tests mcp_tests --parallel 2
          ctest --test-dir build/sanitize -R '^(hosted_commands|hosted_components_io|component_glue_io|diagnostic_inspection|edge_visibility|shading_normals|smooth_export|edge_commands|edge_appearance|orientation_commands|solid_commands|boolean_commands|intersection_commands|sweep_commands|offset_commands|chatgpt_auth|native_assistant_session|ollama_provider|openai_provider|blender_job|glb_export|model_recipes|assistant|inspection(_session)?|staging|outcome_store|transaction_coordinator|transaction_dispatch|automation_session|recipes|mcp)$' --output-on-failure
      - name: Sanitized native MCP inspection
