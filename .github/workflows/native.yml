        env:
          PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
        run: |
          cp packaging/arch/mirrorlist /etc/pacman.d/mirrorlist
          # A cache hit restores this snapshot's databases and every package file: install
          # without -y, so pacman needs no mirror and still verifies every signature.
          # The IFC build packages (boost, eigen, opencascade, patchelf: the PKGBUILD's makedepends
          # for third_party/ifcopenshell) are not in the shared cache entry; pacman fetches them.
          if [ "$PACKAGE_CACHE_HIT" = true ] && pacman -Suu --noconfirm --needed $CI_PACKAGES $CI_IFC_PACKAGES; then
            exit 0
          fi
