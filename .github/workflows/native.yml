name: Native build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    steps:
      - uses: actions/checkout@v4
      - name: Install build and software-rendering dependencies
        run: |
          cp packaging/arch/mirrorlist /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed cmake ninja qt6-base qt6-wayland mesa xorg-server-xvfb xorg-xauth
      - name: Record toolchain
        run: pacman -Q cmake ninja gcc qt6-base qt6-wayland mesa
      - name: Configure and build
        run: |
          cmake --preset dev
          cmake --build --preset dev --parallel 2
      - name: Geometry, document and persistence tests
        run: ctest --preset dev
      - name: Native interaction and OpenGL tests
        run: |
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/curve_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/drawing_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/numeric_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/tool_lifecycle_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/interaction_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/sketchyup --smoke
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/viewport_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 30s build/dev/dialog_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/shell_tests
      - name: Headless recipe
        run: |
          build/dev/sketchyup-cli --script examples/room-shell.json --output /tmp/room.sketchyup
          build/dev/sketchyup-cli --input /tmp/room.sketchyup
      - name: Sanitized core without Qt
        run: |
          cmake --preset sanitize
          cmake --build --preset sanitize --parallel 2
          ctest --preset sanitize
      - name: Disposable Arch package acceptance
        run: |
          useradd --create-home builder
          scripts/package-source.sh /work/package
          cp packaging/arch/verify-package.sh /work/package/
          SKETCHYUP_PACKAGE_SANDBOX=1 bash /work/package/verify-package.sh
