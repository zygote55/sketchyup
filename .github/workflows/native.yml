          path: |
            /var/cache/pacman/pkg
            /var/lib/pacman/sync
          key: ${{ steps.package-cache-key.outputs.key }}
      - name: Record toolchain
        run: pacman -Q cmake ninja gcc boost eigen opencascade patchelf qt6-base ccache mold
      - name: Vendored tree equals the pinned upstream tag, trimmed
        # The pin is the upstream commit and the bytes of every vendored file (ADR 0171 decision 21):
        # no network at build time, but this check downloads the tag archive once to prove the tree.
        run: |
          python scripts/vendor-ifcopenshell.py fetch /tmp/ifcopenshell-upstream
          python scripts/vendor-ifcopenshell.py check /tmp/ifcopenshell-upstream/ifcopenshell-v0.9.0.tar.gz
      - name: Key the IfcOpenShell prefix cache
        id: prefix-key
        # The vendored upstream files and the flags (IfcOpenShellPrefix.cmake, WriteStamp.cmake) on top
        # of what the package cache key already covers: the image, the mirror and the package list.
        # Our own notes in the tree (README, PATCHES, TRIM, IFC-SOURCE, occt/) do not change the build.
        run: |
          sum=$({ find third_party/ifcopenshell -type f ! -name README.sketchyup.md ! -name PATCHES.md ! -name TRIM.txt ! -name IFC-SOURCE.txt ! -path '*/occt/*'; echo src/ifc/IfcOpenShellPrefix.cmake; echo src/ifc/WriteStamp.cmake; } | LC_ALL=C sort | xargs sha256sum | sha256sum | cut -c1-32)
