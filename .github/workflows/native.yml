          scripts/test-wayland.sh build/dev/assistant_preview_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/assistant_preview_tests
          scripts/test-wayland.sh build/dev/render_input_tests
