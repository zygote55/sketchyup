        run: |
          tar --zstd -xf dev-build.tar.zst
          rm dev-build.tar.zst
      - name: Fractional client scaling on native Wayland and X11
        run: |
          for factor in 1.5 1.75; do
            for target in viewport_tests keyboard_modeling_input_tests text_size_input_tests keyboard_outliner_input_tests shortcut_input_tests; do
              QT_WAYLAND_DISABLE_WINDOWDECORATION=1 QT_QPA_PLATFORMTHEME=generic QT_STYLE_OVERRIDE=Fusion QT_IM_MODULE=compose SKETCHYUP_TEST_SCALE=1 scripts/test-wayland.sh env QT_SCALE_FACTOR="$factor" "build/dev/$target"
              xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR="$factor" LIBGL_ALWAYS_SOFTWARE=1 scripts/test-deadline.sh 90 "build/dev/$target"
            done
          done
          # R091.f (ADR 0164 §6): page layout at fractional 1.5 on both platforms.
          QT_WAYLAND_DISABLE_WINDOWDECORATION=1 QT_QPA_PLATFORMTHEME=generic QT_STYLE_OVERRIDE=Fusion QT_IM_MODULE=compose SKETCHYUP_TEST_SCALE=1 scripts/test-wayland.sh env QT_SCALE_FACTOR=1.5 build/dev/sheet_layout_input_tests
          QT_WAYLAND_DISABLE_WINDOWDECORATION=1 QT_QPA_PLATFORMTHEME=generic QT_STYLE_OVERRIDE=Fusion QT_IM_MODULE=compose SKETCHYUP_TEST_SCALE=1 scripts/test-wayland.sh env QT_SCALE_FACTOR=1.5 build/dev/sheet_annotation_input_tests
          QT_WAYLAND_DISABLE_WINDOWDECORATION=1 QT_QPA_PLATFORMTHEME=generic QT_STYLE_OVERRIDE=Fusion QT_IM_MODULE=compose SKETCHYUP_TEST_SCALE=1 scripts/test-wayland.sh env QT_SCALE_FACTOR=1.5 build/dev/sheet_acceptance_input_tests
          QT_WAYLAND_DISABLE_WINDOWDECORATION=1 QT_QPA_PLATFORMTHEME=generic QT_STYLE_OVERRIDE=Fusion QT_IM_MODULE=compose SKETCHYUP_TEST_SCALE=1 scripts/test-wayland.sh env QT_SCALE_FACTOR=1.5 build/dev/sheet_export_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=1.5 LIBGL_ALWAYS_SOFTWARE=1 scripts/test-deadline.sh 120 build/dev/sheet_layout_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=1.5 LIBGL_ALWAYS_SOFTWARE=1 scripts/test-deadline.sh 120 build/dev/sheet_annotation_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=1.5 LIBGL_ALWAYS_SOFTWARE=1 scripts/test-deadline.sh 120 build/dev/sheet_acceptance_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=1.5 LIBGL_ALWAYS_SOFTWARE=1 scripts/test-deadline.sh 120 build/dev/sheet_export_input_tests
      - name: Actual Blender worker lifecycle
        run: |
          SKETCHYUP_BLENDER_TEST=/usr/bin/blender ctest --test-dir build/dev -R '^(blender_real|blender_handoff_real|animation_export_real|m7_presentation_real|gltf_import_real|stl_export_real|stl_import_real|obj_import_real|obj_export_real)$' --output-on-failure
      - name: Reproducible M5 offline acceptance and recordings
        run: scripts/verify-m5-offline.sh build/dev "$PWD/build/m5-evidence" /usr/bin/blender
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: m5-offline-evidence
          path: build/m5-evidence
          if-no-files-found: ignore
  blender:
    name: Blender interoperability
    env:
      # ccache is content-addressed: the compiler binary, flags and every preprocessed
      # input are hashed, so a stale or partial cache can only miss, never mis-build.
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    runs-on: ubuntu-latest
    container: mirror.gcr.io/library/archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install build and software-rendering dependencies
        run: |
          cp packaging/arch/mirrorlist /etc/pacman.d/mirrorlist
          # The pinned archive mirror occasionally stalls; retry the whole sync.
          for attempt in 1 2 3; do
            pacman -Syyuu --noconfirm --needed $CI_PACKAGES $CI_BUILD_PACKAGES && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 30))
          done
      - name: Record toolchain
        id: toolchain
        run: |
          pacman -Q cmake ninja gcc qt6-base qt6-wayland mesa ccache
          echo "gcc=$(pacman -Q gcc | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: /ccache
          key: ccache-dev-v1-51dd3d24-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-dev-v1-51dd3d24-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-
            ccache-dev-v1-51dd3d24-${{ steps.toolchain.outputs.gcc }}-
      - name: Prepare the compiler cache
        run: |
          ccache --zero-stats
          ccache --show-config
      - name: Build the GLB export fixtures
        run: |
          cmake --preset dev
          cmake --build --preset dev --parallel 4 --target glb_export_tests texture_export_tests section_export_tests smooth_export_tests
      - name: GLB validator and Blender interoperability
        run: scripts/ci-blender-interop.sh 4
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose
