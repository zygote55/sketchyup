  audit:
    name: "Native tests: audit and accessibility"
    needs: [plan, build]
    if: needs.plan.outputs.full == 'true' || contains(needs.plan.outputs.jobs, ',audit,')
    env:
      # Qt logs to journald when it has no terminal; CI has no journald, so fatal
      # platform errors vanished (D-033). Force them onto stderr.
      QT_FORCE_STDERR_LOGGING: "1"
    runs-on: ubuntu-latest
    # scripts/test-deadline.sh attaches gdb to a hung test to print its threads (D-034).
    container:
      image: mirror.gcr.io/library/archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
      options: --cap-add=SYS_PTRACE
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Prepare the package cache
        id: package-cache-key
        # One shared entry for every job, keyed on all that decides its files: the base
        # image's packages (the pinned digest), the dated mirror and every package list.
        run: |
          sum=$({ pacman -Q; cat packaging/arch/mirrorlist; printf '%s\n' "$CI_PACKAGES" "$CI_BUILD_PACKAGES" "$CI_TEST_PACKAGES" "$CI_PACKAGE_CHECK_PACKAGES"; } | sha256sum | cut -c1-32)
          echo "key=pacman-v1-51dd3d24-$sum" >> "$GITHUB_OUTPUT"
      - name: Restore the package cache
        id: package-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /var/cache/pacman/pkg
            /var/lib/pacman/sync
          key: ${{ steps.package-cache-key.outputs.key }}
      - name: Install native test runtime dependencies
        env:
          PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
        run: |
          cp packaging/arch/mirrorlist /etc/pacman.d/mirrorlist
          # A cache hit restores this snapshot's databases and every package file: install
          # without -y, so pacman needs no mirror and still verifies every signature.
          if [ "$PACKAGE_CACHE_HIT" = true ] && pacman -Suu --noconfirm --needed $CI_TEST_PACKAGES; then
            exit 0
          fi
          # The pinned archive mirror occasionally stalls; retry the whole sync.
          for attempt in 1 2 3; do
            pacman -Syyuu --noconfirm --needed $CI_TEST_PACKAGES && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 30))
          done
      - name: Record toolchain
        run: pacman -Q gcc qt6-base qt6-wayland mesa weston
      - uses: actions/download-artifact@v7
        with:
          name: dev-build
      - name: Unpack the development build tree
        run: |
          tar --zstd -xf dev-build.tar.zst
          rm dev-build.tar.zst
      - name: Accessibility bridge on X11 and Wayland
        run: |
          # -noreset: libatspi opens and closes a display before the demo starts; a server left
          # without clients resets, and the demo's connection can fail during the reset (D-033).
          xvfb-run -a -s '-screen 0 640x480x24 -noreset' env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=1 LIBGL_ALWAYS_SOFTWARE=1 scripts/test-deadline.sh 90 dbus-run-session -- python tests/accessibility_bridge_test.py build/dev/sketchyup build/accessibility-x11-1.json
          xvfb-run -a -s '-screen 0 640x480x24 -noreset' env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 scripts/test-deadline.sh 90 dbus-run-session -- python tests/accessibility_bridge_test.py build/dev/sketchyup build/accessibility-x11-2.json
          SKETCHYUP_TEST_SCALE=1 dbus-run-session -- scripts/test-wayland.sh python tests/accessibility_bridge_test.py build/dev/sketchyup build/accessibility-wayland-1.json
          SKETCHYUP_TEST_SCALE=2 dbus-run-session -- scripts/test-wayland.sh python tests/accessibility_bridge_test.py build/dev/sketchyup build/accessibility-wayland-2.json
      - name: Keyboard layouts through physical key input
        run: |
          for layout in us de fr; do
            for platform in xcb wayland; do
              SKETCHYUP_TEST_KEYBOARD_LAYOUT=$layout scripts/test-keyboard-layout.sh $platform build/dev/keyboard_layout_input_tests
            done
          done
      - name: All-dialog keyboard audit
        run: |
          # The inventory fails if a "…" command has no audited dialog; it also lists the
          # groups. CI covers both platforms and both scales as X11 2x plus Wayland 1x; the
          # full four-way matrix (Wayland 2x up to 50 s per group) is local evidence in R084.u.
          mkdir -p build/dialog-keyboard
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 scripts/test-deadline.sh 60 build/dev/native_accessibility_audit --dialogs-keyboard=inventory > build/dialog-keyboard/inventory.json
          groups=$(python -c 'import json; print(" ".join(json.load(open("build/dialog-keyboard/inventory.json"))["groups"]))')
          for group in $groups; do
            xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 scripts/test-deadline.sh 90 build/dev/native_accessibility_audit --dialogs-keyboard=$group > build/dialog-keyboard/x11-2-$group.json
            scripts/test-wayland.sh build/dev/native_accessibility_audit --dialogs-keyboard=$group > build/dialog-keyboard/wayland-1-$group.json
          done
