  # flags in src/ifc/IfcOpenShellPrefix.cmake. The fast tier restores the prefix from a cache
  # keyed by exactly those inputs (a 15- to 30-minute compile is not something to recover
  # through compiler-cache hits on a cold runner), so a change to src/ifc or the API probe
  # builds only the helper, in seconds; the first change to the tree or the flags pays the cold
  # build once and saves the prefix. A pushed `main` run and the nightly full tier keep the entry
  # warm. The full tier builds the prefix from source, so a cache problem cannot hide a defect,
  # and runs the helper under ASan and UBSan. Nothing else depends on this job: the application
  # does not link IfcOpenShell, and only changes to its paths select the job (ci-path-map.json).
  ifc:
    name: IFC library and helper
    needs: plan
    if: needs.plan.outputs.full == 'true' || contains(needs.plan.outputs.jobs, ',ifc,')
    runs-on: ubuntu-latest
    container: mirror.gcr.io/library/archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    timeout-minutes: 120
    env:
      # The application's side of the import (R097.b) is built here too, with the fast tier's flags and
      # its compiler cache restored read-only: the IFC job is the only one with both Qt and the helper.
      CCACHE_DIR: /ccache
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v6
      - name: Prepare the package cache
        id: package-cache-key
        # Its own entry, keyed on the image's packages, the dated mirror and the IFC list: this job
        # needs packages (opencascade, vtk) that no other job installs.
        run: |
          sum=$({ pacman -Q; cat packaging/arch/mirrorlist; printf '%s\n' "$CI_IFC_PACKAGES" "$CI_COMPILE_PACKAGES"; } | sha256sum | cut -c1-32)
          echo "key=pacman-ifc-v2-51dd3d24-$sum" >> "$GITHUB_OUTPUT"
          echo "sum=$sum" >> "$GITHUB_OUTPUT"
      - name: Restore the package cache
        id: package-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /var/cache/pacman/pkg
            /var/lib/pacman/sync
          key: ${{ steps.package-cache-key.outputs.key }}
      - name: Install build dependencies
        env:
          PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
        run: |
          cp packaging/arch/mirrorlist /etc/pacman.d/mirrorlist
          # A cache hit restores this snapshot's databases and every package file: install
          # without -y, so pacman needs no mirror and still verifies every signature.
          if [ "$PACKAGE_CACHE_HIT" = true ] && pacman -Suu --noconfirm --needed $CI_IFC_PACKAGES $CI_COMPILE_PACKAGES; then
