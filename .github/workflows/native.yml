  # The declared minimum, Qt 6.8.0, compiles (ADR 0170): the other jobs build on the pinned
  # Qt 6.11.2, whose transitive includes hide a missing #include (D-047). This job builds
  # every target (`all` and the EXCLUDE_FROM_ALL benchmarks and trial) on the release
  # walkthrough's reference snapshot and runs no tests; the Clang fuzzers (off at configure,
  # they need clang) are not built.
  qt68:
    name: Qt 6.8 reference compile
    needs: plan
    if: needs.plan.outputs.full == 'true' || contains(needs.plan.outputs.jobs, ',qt68,')
    env:
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
      # The 2024-10-15 Arch Linux Archive is the first snapshot with qt6-base 6.8.0
      # (2024-10-14 still has 6.7.3); GCC 14.2.1, CMake 3.30.5.
      QT68_ARCHIVE: https://archive.archlinux.org/repos/2024/10/15
      QT68_PACKAGES: cmake ninja pkgconf openssl qt6-base qt6-wayland wayland mesa python ccache mold
    runs-on: ubuntu-latest
    container: mirror.gcr.io/library/archlinux:base-devel-20241013.0.269705@sha256:291198370afb8645d8341adfc354a407c0f981fd66a3bd89a267080db05314c2
    timeout-minutes: 120
