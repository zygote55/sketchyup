name: Native build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    steps:
      - uses: actions/checkout@v4
      - name: Install build and software-rendering dependencies
        run: |
          cp packaging/arch/mirrorlist /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed cmake ninja qt6-base qt6-wayland mesa xorg-server-xvfb xorg-xauth ttf-dejavu weston
      - name: Record toolchain
        run: pacman -Q cmake ninja gcc qt6-base qt6-wayland mesa
      - name: Configure and build
        run: |
          cmake --preset dev
          cmake --build --preset dev --parallel 2
      - name: Geometry, document and persistence tests
        run: ctest --preset dev
      - name: Native interaction and OpenGL tests
        run: |
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 70s build/dev/desktop_inspection_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 70s build/dev/desktop_inspection_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 90s build/dev/m4_workflow_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 90s build/dev/m4_workflow_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 60s build/dev/units_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 60s build/dev/units_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/history_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/history_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/recovery_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/recovery_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/formline_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/formline_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/material_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/material_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/material_viewport_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/material_viewport_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/entity_info_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/entity_info_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/organization_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/organization_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/component_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/component_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/group_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 50s build/dev/group_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/array_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/array_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/transform_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/transform_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/navigation_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/navigation_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/selection_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/selection_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/guide_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/guide_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/constraint_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/constraint_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/inference_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/inference_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/curve_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/drawing_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/numeric_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/tool_lifecycle_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/interaction_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/sketchyup --smoke
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/viewport_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 30s build/dev/dialog_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 40s build/dev/shell_tests
      - name: Isolated Wayland interaction and rendering
        run: |
          scripts/test-wayland.sh build/dev/desktop_inspection_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/desktop_inspection_tests
          scripts/test-wayland.sh build/dev/m4_workflow_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/m4_workflow_tests
          scripts/test-wayland.sh build/dev/units_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/units_input_tests
          scripts/test-wayland.sh build/dev/history_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/history_input_tests
          scripts/test-wayland.sh build/dev/recovery_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/recovery_input_tests
          scripts/test-wayland.sh build/dev/formline_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/formline_input_tests
          scripts/test-wayland.sh build/dev/material_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/material_input_tests
          scripts/test-wayland.sh build/dev/material_viewport_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/material_viewport_tests
          scripts/test-wayland.sh build/dev/entity_info_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/entity_info_input_tests
          scripts/test-wayland.sh build/dev/organization_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/organization_input_tests
          scripts/test-wayland.sh build/dev/component_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/component_input_tests
          scripts/test-wayland.sh build/dev/group_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/group_input_tests
          scripts/test-wayland.sh build/dev/selection_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/selection_input_tests
          scripts/test-wayland.sh build/dev/transform_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/transform_input_tests
          scripts/test-wayland.sh build/dev/array_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/array_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/sketchyup --smoke
      - name: Headless recipe
        run: |
          build/dev/sketchyup-cli --input examples/m4-room-study.sketchyup --query document.describe
          build/dev/sketchyup-cli --script examples/document-units.json --output /tmp/units.sketchyup
          build/dev/sketchyup-cli --input /tmp/units.sketchyup --query document.describe
          build/dev/sketchyup-cli --import-formline tests/fixtures/formline-v1.formline --output /tmp/formline.sketchyup
          build/dev/sketchyup-cli --input /tmp/formline.sketchyup --query entity.inspect --context 2
          build/dev/sketchyup-cli --script examples/managed-assets.json --output /tmp/managed-assets.sketchyup
          build/dev/sketchyup-cli --input /tmp/managed-assets.sketchyup --query assets.describe
          build/dev/sketchyup-cli --script examples/materials.json --output /tmp/materials.sketchyup
          build/dev/sketchyup-cli --input /tmp/materials.sketchyup --query materials.describe
          build/dev/sketchyup-cli --script examples/entity-info.json --output /tmp/entity-info.sketchyup
          build/dev/sketchyup-cli --input /tmp/entity-info.sketchyup --query entity.inspect --context 1
          build/dev/sketchyup-cli --script examples/room-shell.json --output /tmp/room.sketchyup
          build/dev/sketchyup-cli --input /tmp/room.sketchyup
          build/dev/sketchyup-cli --script examples/colored-explode.json --output /tmp/colored-explode.sketchyup
          build/dev/sketchyup-cli --input /tmp/colored-explode.sketchyup
          build/dev/sketchyup-cli --script examples/tags.json --output /tmp/tags.sketchyup
          build/dev/sketchyup-cli --input /tmp/tags.sketchyup --query tags.describe
          build/dev/sketchyup-cli --script examples/components.json --output /tmp/components.sketchyup
          build/dev/sketchyup-cli --input /tmp/components.sketchyup
          build/dev/sketchyup-cli --script examples/groups.json --output /tmp/groups.sketchyup
          build/dev/sketchyup-cli --input /tmp/groups.sketchyup
          build/dev/sketchyup-cli --script examples/copy-arrays.json --output /tmp/arrays.sketchyup
          build/dev/sketchyup-cli --script examples/guides.json --output /tmp/guides.sketchyup
          build/dev/sketchyup-cli --input /tmp/guides.sketchyup --query geometry.inspect --context 1
      - name: Sanitized core without Qt
        run: |
          cmake --preset sanitize
          cmake --build --preset sanitize --parallel 2
          ctest --preset sanitize
      - name: Sanitized bounded inspection and CLI
        run: |
          cmake --preset sanitize -DSKETCHYUP_BUILD_CLI=ON
          cmake --build --preset sanitize --target inspection_tests inspection_session_tests staging_tests outcome_store_tests --parallel 2
          ctest --test-dir build/sanitize -R '^(inspection(_session)?|staging|outcome_store)$' --output-on-failure
      - name: Disposable Arch package acceptance
        run: |
          useradd --create-home builder
          scripts/package-source.sh /work/package
          cp packaging/arch/verify-package.sh /work/package/
          SKETCHYUP_PACKAGE_SANDBOX=1 bash /work/package/verify-package.sh
