name: Native build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Superseded pull request heads are canceled. Each main push gets a unique
# group: a shared group would still let a newer pending run replace an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CI_PACKAGES: >-
    cmake ninja meson pkgconf openssl qt6-base qt6-wayland wayland mesa
    xorg-server-xvfb xorg-xauth ttf-dejavu weston curl python-pip python-jsonschema
    nodejs npm blender ffmpeg poppler at-spi2-core
jobs:
  arch:
    name: Development build and native tests
    runs-on: ubuntu-latest
    container: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Install build and software-rendering dependencies
        run: |
          cp packaging/arch/mirrorlist /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed $CI_PACKAGES
      - name: Record toolchain
        run: pacman -Q cmake ninja gcc qt6-base qt6-wayland mesa
      - name: Configure desktop tests without the optional CLI
        run: |
          cmake -S . -B build/configure-desktop-no-cli -G Ninja -DSKETCHYUP_BUILD_DESKTOP=ON -DSKETCHYUP_BUILD_CLI=OFF -DBUILD_TESTING=ON
      - name: Configure and build
        run: |
          cmake --preset dev
          cmake --build --preset dev --parallel 2
      - name: Geometry, document and persistence tests
        run: |
          rm -f build/mcp-transcript.jsonl
          SKETCHYUP_MCP_TRANSCRIPT="$PWD/build/mcp-transcript.jsonl" ctest --preset dev
      - name: Pinned MCP protocol schema validation
        run: |
          curl -fLsS https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/271ecc9accafdd9b83a3c869fa67c22953b2af80/schema/2026-07-28/schema.json -o build/mcp-schema.json
          python scripts/verify-mcp-schema.py build/mcp-schema.json build/mcp-transcript.jsonl > build/mcp-schema-validation.json
      - name: Shipped recipes reproduce measured geometry
        run: python scripts/verify-shipped-recipes.py --cli build/dev/sketchyup-cli --examples examples
      - name: Generated reference matches live registries
        run: python scripts/generate-tool-reference.py --cli build/dev/sketchyup-cli --root . --check
      - name: GLB validator and Blender interoperability
        run: |
          mkdir -p build/gltf-validator
          cp tests/gltf-validator/package*.json build/gltf-validator/
          npm ci --prefix build/gltf-validator --ignore-scripts --no-audit --no-fund
          build/dev/glb_export_tests build/glb-fixtures
          node scripts/verify-glb.mjs build/gltf-validator build/glb-fixtures > build/glb-validation.json
          build/dev/texture_export_tests build/texture-fixtures
          node scripts/verify-glb.mjs build/gltf-validator build/texture-fixtures 12 > build/texture-glb-validation.json
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/verify-blender-textures.py -- build/texture-fixtures
          SKETCHYUP_SECTION_EXPORT_EVIDENCE="$PWD/build/section-fixtures" build/dev/section_export_tests
          node scripts/verify-glb.mjs build/gltf-validator build/section-fixtures 2 > build/section-glb-validation.json
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/verify-blender-sections.py -- build/section-fixtures
          build/dev/smooth_export_tests build/smooth-fixtures
          node scripts/verify-glb.mjs build/gltf-validator build/smooth-fixtures 4 > build/smooth-glb-validation.json
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/verify-blender-smooth.py -- build/smooth-fixtures
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/verify-blender-glb.py -- build/glb-fixtures
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/verify-blender-sides.py -- build/glb-fixtures
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/verify-blender-solar.py -- build/solar-oracle
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/verify-blender-environment.py -- build/environment-oracle
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/verify-blender-solar.py -- build/solar-oracle-eevee eevee
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/verify-blender-environment.py -- build/environment-oracle-eevee eevee
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/verify-blender-smooth.py -- build/smooth-fixtures eevee
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/verify-blender-sections.py -- build/section-fixtures eevee
          blender --background --factory-startup --disable-autoexec --python-exit-code 1 --python scripts/verify-blender-textures.py -- build/texture-fixtures eevee
      - name: Actual Blender worker lifecycle
        run: |
          SKETCHYUP_BLENDER_TEST=/usr/bin/blender ctest --test-dir build/dev -R '^(blender_real|blender_handoff_real|animation_export_real|m7_presentation_real|gltf_import_real|stl_export_real|stl_import_real|obj_import_real|obj_export_real)$' --output-on-failure
      - name: Independent DXF consumer
        run: |
          python -m venv build/dxf-oracle
          build/dxf-oracle/bin/pip install -r tests/dxf-oracle-requirements.txt
          SKETCHYUP_DXF_TEST="$PWD/build/dxf-oracle/bin/python" ctest --test-dir build/dev -R '^dxf_export_real$' --output-on-failure
      - name: Independent measured PDF consumer
        run: SKETCHYUP_PDF_TEST=/usr/bin/pdftoppm ctest --test-dir build/dev -R '^measured_export_real$' --output-on-failure
      - name: Native interaction and OpenGL tests
        run: |
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 90s build/dev/assistant_panel_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 90s build/dev/assistant_panel_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 90s build/dev/assistant_preview_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 90s build/dev/assistant_preview_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 SKETCHYUP_BLENDER_TEST=/usr/bin/blender timeout 90s build/dev/render_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 90s build/dev/render_input_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 90s build/dev/native_mcp_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 90s build/dev/native_mcp_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 70s build/dev/desktop_inspection_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb QT_SCALE_FACTOR=2 LIBGL_ALWAYS_SOFTWARE=1 timeout 70s build/dev/desktop_inspection_tests
          xvfb-run -a env QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 timeout 90s build/dev/m4_workflow_tests
