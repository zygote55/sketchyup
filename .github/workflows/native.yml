          for attempt in 1 2 3; do
            pacman -Syyuu --noconfirm --needed $CI_PACKAGES $CI_IFC_PACKAGES && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 30))
          done
