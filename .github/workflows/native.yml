  # compile set: it proves the vendored tree equals the pinned archives (one download; the
  # script reads them in memory-safe fashion and executes nothing from them), builds the
  # helper and the application's import through the fast tier's flags and runs the SKP
  # tests. Only changes to its paths select the job (ci-path-map.json); the fast tier's
