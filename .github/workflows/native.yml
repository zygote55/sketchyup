name: Native build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
# Superseded pull request heads are canceled. Each main push gets a unique
# group: a shared group would still let a newer pending run replace an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Containers come from Google's Docker Hub mirror: the same pinned digest
# without Docker Hub's anonymous pull rate limit, which parallel jobs exceed.
env:
  CI_PACKAGES: >-
    cmake ninja meson pkgconf openssl qt6-base qt6-wayland wayland mesa
    xorg-server-xvfb xorg-xauth ttf-dejavu weston curl python-pip python-jsonschema
    nodejs npm blender ffmpeg poppler at-spi2-core gdb
  # Added to CI_PACKAGES where a job compiles; python-yaml reads this workflow for
  # scripts/ci-line-inventory.py.
  CI_BUILD_PACKAGES: ccache python-yaml
  # Native test jobs run prebuilt binaries: CI_PACKAGES without the build-only and
  # Node tools. Blender, Poppler and FFmpeg stay, because the application probes for
  # them and the tests' behaviour depends on what it finds.
  CI_TEST_PACKAGES: >-
    openssl qt6-base qt6-wayland wayland mesa xorg-server-xvfb xorg-xauth ttf-dejavu
    weston python blender ffmpeg poppler at-spi2-core gdb
# Every job must pass. The development build runs once; the native test jobs reuse its
# build tree (the dev-build artifact) and run in parallel.
jobs:
  build:
    name: Development build and checks
    env:
      # Qt logs to journald when it has no terminal; CI has no journald, so fatal
      # platform errors vanished (D-033). Force them onto stderr.
      QT_FORCE_STDERR_LOGGING: "1"
      # ccache is content-addressed: the compiler binary, flags and every preprocessed
      # input are hashed, so a stale or partial cache can only miss, never mis-build.
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    runs-on: ubuntu-latest
    # scripts/test-deadline.sh attaches gdb to a hung test to print its threads (D-034).
    container:
      image: mirror.gcr.io/library/archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
      options: --cap-add=SYS_PTRACE
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - name: Install build and software-rendering dependencies
        run: |
          cp packaging/arch/mirrorlist /etc/pacman.d/mirrorlist
          # The pinned archive mirror occasionally stalls; retry the whole sync.
          for attempt in 1 2 3; do
            pacman -Syyuu --noconfirm --needed $CI_PACKAGES $CI_BUILD_PACKAGES && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 30))
          done
      - name: Record toolchain
        id: toolchain
        run: |
          pacman -Q cmake ninja gcc qt6-base qt6-wayland mesa ccache
          echo "gcc=$(pacman -Q gcc | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Check the test-line inventory
        # Every test line of the former single job must appear exactly once across the
        # split jobs, with the same container and environment.
        run: python scripts/ci-line-inventory.py check .github/workflows/native.yml .github/ci-line-inventory.txt
      - name: Restore the compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: /ccache
          key: ccache-dev-v1-51dd3d24-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-dev-v1-51dd3d24-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-
            ccache-dev-v1-51dd3d24-${{ steps.toolchain.outputs.gcc }}-
      - name: Prepare the compiler cache
        run: |
          ccache --zero-stats
          ccache --show-config
      - name: Configure desktop tests without the optional CLI
        run: |
          cmake -S . -B build/configure-desktop-no-cli -G Ninja -DSKETCHYUP_BUILD_DESKTOP=ON -DSKETCHYUP_BUILD_CLI=OFF -DBUILD_TESTING=ON
      - name: Configure and build
        run: |
          cmake --preset dev
          cmake --build --preset dev --parallel 4
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose
      # Pushes to main refresh the shared cache; a pull request saves its own only when
      # nothing was restored, so pull requests do not evict main's entries.
      - name: Save the compiler cache
        if: success() && (github.event_name == 'push' || steps.ccache-restore.outputs.cache-matched-key == '')
        uses: actions/cache/save@v5
        with:
          path: /ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
      - name: Pack the development build tree
        # Executables, CTest files and generated data, with debug sections stripped:
        # the unstripped tree is about 37 GB (see the script).
        run: scripts/ci-pack-build.sh build/dev dev-build.tar.zst
      - uses: actions/upload-artifact@v6
        with:
          name: dev-build
          path: dev-build.tar.zst
          compression-level: 0
          retention-days: 1
          overwrite: true
      - name: Geometry, document and persistence tests
        run: |
          rm -f build/mcp-transcript.jsonl
          SKETCHYUP_MCP_TRANSCRIPT="$PWD/build/mcp-transcript.jsonl" ctest --preset dev
      - name: Pinned MCP protocol schema validation
        run: |
          curl -fLsS https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/271ecc9accafdd9b83a3c869fa67c22953b2af80/schema/2026-07-28/schema.json -o build/mcp-schema.json
          python scripts/verify-mcp-schema.py build/mcp-schema.json build/mcp-transcript.jsonl > build/mcp-schema-validation.json
      - name: Shipped recipes reproduce measured geometry
        run: python scripts/verify-shipped-recipes.py --cli build/dev/sketchyup-cli --examples examples
      - name: Generated reference matches live registries
        run: python scripts/generate-tool-reference.py --cli build/dev/sketchyup-cli --root . --check
      - name: Generated API schemas match live registries
        run: python scripts/generate-api-schemas.py --cli build/dev/sketchyup-cli --app build/dev/sketchyup --root . --check
      - name: Install the glTF validator
        run: |
          mkdir -p build/gltf-validator
          cp tests/gltf-validator/package*.json build/gltf-validator/
          npm ci --prefix build/gltf-validator --ignore-scripts --no-audit --no-fund
      - name: Independent DXF consumer
        run: |
          python -m venv build/dxf-oracle
          build/dxf-oracle/bin/pip install -r tests/dxf-oracle-requirements.txt
          SKETCHYUP_DXF_TEST="$PWD/build/dxf-oracle/bin/python" ctest --test-dir build/dev -R '^dxf_export_real$' --output-on-failure
      - name: Independent measured PDF consumer
        run: SKETCHYUP_PDF_TEST=/usr/bin/pdftoppm ctest --test-dir build/dev -R '^(measured_export_real|sheet_export_real)$' --output-on-failure
      - name: Headless recipe
        run: |
          build/dev/sketchyup-cli --script examples/asserted-solid.json --output /tmp/asserted-solid.sketchyup
          build/dev/sketchyup-cli --input /tmp/asserted-solid.sketchyup
          build/dev/sketchyup-cli --script examples/planar-offset.json --output /tmp/offset.sketchyup
          build/dev/sketchyup-cli --input /tmp/offset.sketchyup --query document.describe
          build/dev/sketchyup-cli --input examples/m4-room-study.sketchyup --query document.describe
          build/dev/sketchyup-cli --script examples/document-units.json --output /tmp/units.sketchyup
          build/dev/sketchyup-cli --input /tmp/units.sketchyup --query document.describe
          build/dev/sketchyup-cli --import-formline tests/fixtures/formline-v1.formline --output /tmp/formline.sketchyup
          build/dev/sketchyup-cli --input /tmp/formline.sketchyup --query entity.inspect --context 2
          build/dev/sketchyup-cli --script examples/managed-assets.json --output /tmp/managed-assets.sketchyup
          build/dev/sketchyup-cli --input /tmp/managed-assets.sketchyup --query assets.describe
          build/dev/sketchyup-cli --script examples/materials.json --output /tmp/materials.sketchyup
          build/dev/sketchyup-cli --script examples/texture-mapping.json --output /tmp/texture-mapping.sketchyup
          mkdir -p build/texture-command-fixtures
          build/dev/sketchyup-cli --input /tmp/texture-mapping.sketchyup --export-glb build/texture-command-fixtures/mapped
          node scripts/verify-glb.mjs build/gltf-validator build/texture-command-fixtures 1 > build/texture-command-glb-validation.json
          build/dev/sketchyup-cli --input /tmp/materials.sketchyup --query materials.describe
          build/dev/sketchyup-cli --script examples/entity-info.json --output /tmp/entity-info.sketchyup
          build/dev/sketchyup-cli --input /tmp/entity-info.sketchyup --query entity.inspect --context 1
          build/dev/sketchyup-cli --script examples/room-shell.json --output /tmp/room.sketchyup
          build/dev/sketchyup-cli --input /tmp/room.sketchyup
          build/dev/sketchyup-cli --script examples/colored-explode.json --output /tmp/colored-explode.sketchyup
          build/dev/sketchyup-cli --input /tmp/colored-explode.sketchyup
          build/dev/sketchyup-cli --script examples/tags.json --output /tmp/tags.sketchyup
          build/dev/sketchyup-cli --input /tmp/tags.sketchyup --query tags.describe
          build/dev/sketchyup-cli --script examples/components.json --output /tmp/components.sketchyup
          build/dev/sketchyup-cli --input /tmp/components.sketchyup
          build/dev/sketchyup-cli --script examples/groups.json --output /tmp/groups.sketchyup
          build/dev/sketchyup-cli --input /tmp/groups.sketchyup
          build/dev/sketchyup-cli --script examples/copy-arrays.json --output /tmp/arrays.sketchyup
          build/dev/sketchyup-cli --script examples/face-orientation.json --output /tmp/face-orientation.sketchyup
          build/dev/sketchyup-cli --input /tmp/face-orientation.sketchyup
          build/dev/sketchyup-cli --script examples/solid-trim.json --output /tmp/solid-trim.sketchyup
          build/dev/sketchyup-cli --input /tmp/solid-trim.sketchyup
          build/dev/sketchyup-cli --script examples/solid-split.json --output /tmp/solid-split.sketchyup
          build/dev/sketchyup-cli --input /tmp/solid-split.sketchyup
          build/dev/sketchyup-cli --script examples/solid-outer-shell.json --output /tmp/solid-outer-shell.sketchyup
          build/dev/sketchyup-cli --input /tmp/solid-outer-shell.sketchyup
          build/dev/sketchyup-cli --script examples/enclosed-cavity.json --output /tmp/enclosed-cavity.sketchyup
          build/dev/sketchyup-cli --input /tmp/enclosed-cavity.sketchyup
          build/dev/sketchyup-cli --script examples/solid-boolean.json --output /tmp/solid-boolean.sketchyup
          build/dev/sketchyup-cli --input /tmp/solid-boolean.sketchyup
          build/dev/sketchyup-cli --script examples/face-intersection.json --output /tmp/face-intersection.sketchyup
          build/dev/sketchyup-cli --input /tmp/face-intersection.sketchyup
          build/dev/sketchyup-cli --script examples/profile-sweep.json --output /tmp/profile-sweep.sketchyup
          build/dev/sketchyup-cli --input /tmp/profile-sweep.sketchyup
          build/dev/sketchyup-cli --script examples/guides.json --output /tmp/guides.sketchyup
          build/dev/sketchyup-cli --input /tmp/guides.sketchyup --query geometry.inspect --context 1
