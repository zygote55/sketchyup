        run: |
          cmake --preset ifc
          cmake --build --preset ifc --parallel "$(nproc)"
      - name: Save the IfcOpenShell prefix
        if: success() && steps.prefix.outputs.cache-hit != 'true' && (needs.plan.outputs.full != 'true' || github.ref == 'refs/heads/main')
        uses: actions/cache/save@v5
        with:
          path: build/ifc-prefix
          key: ${{ steps.prefix-key.outputs.key }}
      - name: Helper, API probe and library checks
        # The damaged-file corpus of 512 mutations per file (label full) runs in the full tier only.
        run: ctest --test-dir build/ifc -R '^ifc_' -LE full --output-on-failure --no-tests=error --parallel 2
      - name: Damaged-file corpus, 512 mutations of each certification file
        if: needs.plan.outputs.full == 'true'
        run: ctest --test-dir build/ifc -L full --output-on-failure --no-tests=error
      - name: Restore the fast tier's compiler cache
        uses: actions/cache/restore@v5
        with:
          path: /ccache
          key: ccache-fast-v1-${{ github.sha }}-${{ github.run_id }}
          restore-keys: ccache-fast-v1-
      - name: Prepare the compiler cache
        run: |
          mkdir -p /ccache
          ccache --zero-stats
      - name: Build the application's import and its tests
        run: |
          cmake --preset ifc-app
          cmake --build --preset ifc-app --parallel "$(nproc)"
      - name: Compiler cache statistics
        run: ccache --show-stats
      - name: The import through the application
        # The package decoder and the conversion (hand-built packages), then the whole import through the
        # helper against the raw-text scan, the restart path and the command line. The refusals of the
        # downloadable types the import cannot read (R105.a: ZIP, COLLADA, USDZ, FBX) need no helper.
        # The helper under its sandbox (ADR 0183, R109 S2): every fixture identical to the unsandboxed code, the attack probes
        # refused, the refusals named, and the host's classes. Landlock must be on the runner's kernel: the checks fail,
        # not skip, without it.
        run: ctest --test-dir build/ifc-app -R '^(ifc_package|ifc_convert|ifc_import|ifc_worker_run|ifc_export|ifc_step|ifc_step_export|step_import|import_refusal|ifc_sandbox)$' --output-on-failure --no-tests=error --parallel 2
