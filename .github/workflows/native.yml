          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          plan = needs["plan"]
          out = plan.get("outputs", {})
          on = lambda name: out.get(name) == "true"
          full_jobs = ["build", "x11-1x", "x11-2x", "wayland-1x", "wayland-2x", "audit",
                       "fractional", "blender", "sanitize", "ifc", "package", "qt68"]
          required = {"plan"}
          if on("build"):
              required.add("fast")
              if on("wide"):
                  required.add("compile")
          if on("native"):
              required.add("fast-x11")
          if on("full"):
              required.update(full_jobs)
          if on("blender"):
              required.add("blender")
          if on("package"):
              required.add("package")
          required.update(job for job in out.get("jobs", ",").split(",") if job)
          bad = []
          for job, info in sorted(needs.items()):
              result = info["result"]
              wanted = job in required
              print(f"{job:12} {result:10} {'required' if wanted else ''}")
              if result in ("failure", "cancelled") or (wanted and result != "success"):
                  bad.append(job)
          if bad:
              print(f"::error::Not green: {', '.join(bad)}")
              sys.exit(1)
          print("All selected jobs succeeded.")
          PY
