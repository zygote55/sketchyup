          scripts/test-wayland.sh build/dev/sweep_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/sweep_input_tests
          scripts/test-wayland.sh build/dev/offset_input_tests
          SKETCHYUP_TEST_SCALE=2 scripts/test-wayland.sh build/dev/offset_input_tests
          scripts/test-wayland.sh build/dev/assistant_panel_tests
