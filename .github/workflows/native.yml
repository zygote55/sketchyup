        id: package-cache-key
        run: |
          sum=$({ printf '%s\n' "$QT68_ARCHIVE" "$QT68_PACKAGES"; } | sha256sum | cut -c1-32)
          echo "key=pacman-qt68-v1-29119837-$sum" >> "$GITHUB_OUTPUT"
      - name: Restore the package cache
        id: package-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /var/cache/pacman/pkg
            /var/lib/pacman/sync
          key: ${{ steps.package-cache-key.outputs.key }}
      - name: Install build dependencies
        env:
          PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
        run: |
          echo "Server = $QT68_ARCHIVE/\$repo/os/\$arch" > /etc/pacman.d/mirrorlist
          # The 2024 packager keys have since expired or been retired, so today's clock
          # rejects packages that were valid in the snapshot (the walkthrough checks them
          # as of 2024-10-16). The archive is fetched over HTTPS, pinned by date.
          sed -i 's/^SigLevel.*/SigLevel = Never/' /etc/pacman.conf
          if [ "$PACKAGE_CACHE_HIT" = true ] && pacman -Suu --noconfirm --needed $QT68_PACKAGES; then
            exit 0
          fi
          for attempt in 1 2 3; do
            pacman -Syyuu --noconfirm --needed $QT68_PACKAGES && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 30))
          done
      - name: Save the package cache
        if: success() && steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /var/cache/pacman/pkg
            /var/lib/pacman/sync
          key: ${{ steps.package-cache-key.outputs.key }}
      - name: Record toolchain
        id: toolchain
        run: |
          pacman -Q cmake ninja gcc qt6-base qt6-wayland mesa ccache mold
          test "$(pacman -Q qt6-base | cut -d' ' -f2 | cut -d- -f1)" = 6.8.0
          echo "gcc=$(pacman -Q gcc | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: /ccache
          key: ccache-qt68-v1-29119837-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-qt68-v1-29119837-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-
            ccache-qt68-v1-29119837-${{ steps.toolchain.outputs.gcc }}-
      - name: Prepare the compiler cache
        run: |
          ccache --zero-stats
          ccache --show-config
      - name: Compile all targets on Qt 6.8.0
        # -k 0 keeps going past errors, so one run lists every break. The fast preset
        # (no debug info, shared libraries, mold) compiles the same sources as `dev`.
        run: |
          cmake --preset ci-fast
          cmake --build --preset ci-fast --parallel 4 --target all terrain_triangulation_benchmark terrain_edit_benchmark assistant_workflow_trial native_persistence_benchmark component_placement_scaling component_placement_scaling_raised_limits -- -k 0
      - name: Compiler cache statistics
        if: always()
