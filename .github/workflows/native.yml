          build/dev/sketchyup-cli --input /tmp/solid-outer-shell.sketchyup
          build/dev/sketchyup-cli --script examples/enclosed-cavity.json --output /tmp/enclosed-cavity.sketchyup
          build/dev/sketchyup-cli --input /tmp/enclosed-cavity.sketchyup
          build/dev/sketchyup-cli --script examples/solid-boolean.json --output /tmp/solid-boolean.sketchyup
          build/dev/sketchyup-cli --input /tmp/solid-boolean.sketchyup
          build/dev/sketchyup-cli --script examples/face-intersection.json --output /tmp/face-intersection.sketchyup
          build/dev/sketchyup-cli --input /tmp/face-intersection.sketchyup
          build/dev/sketchyup-cli --script examples/profile-sweep.json --output /tmp/profile-sweep.sketchyup
