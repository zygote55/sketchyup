  sanitize:
    name: Sanitized builds
    runs-on: ubuntu-latest
    container: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install build and software-rendering dependencies
        run: |
          cp packaging/arch/mirrorlist /etc/pacman.d/mirrorlist
          pacman -Syyuu --noconfirm --needed $CI_PACKAGES
      - name: Record toolchain
        run: pacman -Q cmake ninja gcc qt6-base qt6-wayland mesa
      - name: Sanitized core without Qt
        run: |
          cmake --preset sanitize
          cmake --build --preset sanitize --parallel 2
          ctest --preset sanitize
      - name: Sanitized bounded inspection and CLI
        run: |
          cmake --preset sanitize -DSKETCHYUP_BUILD_CLI=ON
          cmake --build --preset sanitize --target shortcut_bindings_tests extension_worker_tests extension_store_tests extension_manifest_tests library_bundle_tests measured_cli_tests measured_export_tests measured_drawing_tests measured_view_tests dxf_export_tests dxf_import_tests dxf_source_tests stl_export_tests stl_import_tests stl_source_tests obj_export_tests obj_import_tests obj_source_tests obj_material_tests gltf_import_tests gltf_package_tests native_format_tests m7_presentation_tests reference_image_command_tests reference_image_io_tests reference_image_tests solar_command_tests solar_io_tests solar_tests text_command_tests text_source_io_tests text_worker_tests text_geometry_tests annotation_command_tests annotation_record_tests annotation_io_tests annotation_anchor_tests section_export_tests section_command_tests section_record_tests section_io_tests section_geometry_tests saved_scene_command_tests saved_scene_tests saved_scene_io_tests model_style_command_tests model_style_tests model_style_io_tests texture_command_tests texture_export_tests texture_image_tests face_texture_tests texture_mapping_tests m6_workflow_tests hosted_command_tests hosted_components_io_tests component_glue_io_tests diagnostic_inspection_tests edge_visibility_tests shading_normals_tests smooth_export_tests edge_command_tests edge_appearance_tests orientation_command_tests solid_command_tests boolean_command_tests intersection_command_tests sweep_command_tests offset_command_tests chatgpt_auth_tests native_assistant_session_tests ollama_provider_tests openai_provider_tests animation_capture_tests animation_export_tests render_queue_tests render_store_tests blender_handoff_tests blender_job_tests glb_export_tests site_recipe_tests furniture_recipe_tests stair_recipe_tests roof_recipe_tests measurement_assertion_tests recipe_hosted_tests model_recipes_tests assistant_tests inspection_tests inspection_session_tests staging_tests outcome_store_tests transaction_coordinator_tests transaction_dispatch_tests automation_session_tests recipe_tests mcp_tests --parallel 2
          ctest --test-dir build/sanitize -R '^(shortcut_bindings|extension_worker|extension_store|extension_manifest|library_bundle|measured_cli|measured_export|measured_drawing|measured_view|dxf_export|dxf_import|dxf_source|stl_export|stl_import|stl_source|obj_export|obj_import|obj_source|obj_material|gltf_import|gltf_package|native_format|m7_presentation|reference_image_commands|reference_image_io|reference_image|solar_commands|solar_io|solar|text_commands|text_source_io|text_worker|text_geometry|annotation_commands|annotation_records|annotations_io|annotation_anchors|section_export|section_commands|section_records|sections_io|section_geometry|saved_scene_commands|saved_scenes|saved_scenes_io|model_style_commands|model_style|model_style_io|texture_commands|texture_export|texture_image|face_textures|texture_mapping|m6_workflow|hosted_commands|hosted_components_io|component_glue_io|diagnostic_inspection|edge_visibility|shading_normals|smooth_export|edge_commands|edge_appearance|orientation_commands|solid_commands|boolean_commands|intersection_commands|sweep_commands|offset_commands|chatgpt_auth|native_assistant_session|ollama_provider|openai_provider|animation_capture|animation_export|render_queue|render_store|blender_handoff|blender_job|glb_export|site_recipe|furniture_recipe|stair_recipe|roof_recipe|measurement_assertions|recipe_hosted|model_recipes|assistant|inspection(_session)?|staging|outcome_store|transaction_coordinator|transaction_dispatch|automation_session|recipes|mcp)$' --output-on-failure
      - name: Sanitized shipped recipes and discovery
        run: |
          cmake --build --preset sanitize --target sketchyup-cli m8_exchange_tests --parallel 2
          ctest --test-dir build/sanitize -R '^(m8_exchange|shipped_recipes|optional_capabilities|tool_reference_drift)$' --output-on-failure
      - name: Verify private Wayland client reference fix
        run: scripts/ci-wayland-client.sh "$PWD/build/ci-wayland-client"
      - name: Sanitized native MCP inspection
        run: |
