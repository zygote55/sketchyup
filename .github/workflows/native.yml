  blender:
    name: Blender interoperability
    needs: plan
    if: needs.plan.outputs.full == 'true' || needs.plan.outputs.blender == 'true' || contains(needs.plan.outputs.jobs, ',blender,')
    env:
      # ccache is content-addressed: the compiler binary, flags and every preprocessed
      # input are hashed, so a stale or partial cache can only miss, never mis-build.
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPILERCHECK: content
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    runs-on: ubuntu-latest
    container: mirror.gcr.io/library/archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Prepare the package cache
        id: package-cache-key
        # One shared entry for every job, keyed on all that decides its files: the base
        # image's packages (the pinned digest), the dated mirror and every package list.
        run: |
          sum=$({ pacman -Q; cat packaging/arch/mirrorlist; printf '%s\n' "$CI_PACKAGES" "$CI_BUILD_PACKAGES" "$CI_TEST_PACKAGES" "$CI_PACKAGE_CHECK_PACKAGES"; } | sha256sum | cut -c1-32)
          echo "key=pacman-v1-51dd3d24-$sum" >> "$GITHUB_OUTPUT"
      - name: Restore the package cache
        id: package-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            /var/cache/pacman/pkg
            /var/lib/pacman/sync
          key: ${{ steps.package-cache-key.outputs.key }}
      - name: Install build and software-rendering dependencies
        env:
          PACKAGE_CACHE_HIT: ${{ steps.package-cache.outputs.cache-hit }}
        run: |
          cp packaging/arch/mirrorlist /etc/pacman.d/mirrorlist
          # A cache hit restores this snapshot's databases and every package file: install
          # without -y, so pacman needs no mirror and still verifies every signature.
          if [ "$PACKAGE_CACHE_HIT" = true ] && pacman -Suu --noconfirm --needed $CI_PACKAGES $CI_BUILD_PACKAGES; then
            exit 0
          fi
          # The pinned archive mirror occasionally stalls; retry the whole sync.
          for attempt in 1 2 3; do
            pacman -Syyuu --noconfirm --needed $CI_PACKAGES $CI_BUILD_PACKAGES &&
              pacman -Sw --noconfirm $CI_PACKAGE_CHECK_PACKAGES && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 30))
          done
      - name: Save the package cache
        # Only the jobs installing the full build set save it: their downloads cover
        # every other job's packages. The key never changes for a snapshot, so a hit
        # has nothing to add.
        if: success() && steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            /var/cache/pacman/pkg
            /var/lib/pacman/sync
          key: ${{ steps.package-cache-key.outputs.key }}
      - name: Record toolchain
        id: toolchain
        run: |
          pacman -Q cmake ninja gcc qt6-base qt6-wayland mesa ccache
          echo "gcc=$(pacman -Q gcc | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Restore the compiler cache
        id: ccache-restore
        uses: actions/cache/restore@v5
        with:
          path: /ccache
          key: ccache-dev-v1-51dd3d24-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-${{ github.run_id }}
          restore-keys: |
            ccache-dev-v1-51dd3d24-${{ steps.toolchain.outputs.gcc }}-${{ hashFiles('CMakeLists.txt', 'CMakePresets.json') }}-
            ccache-dev-v1-51dd3d24-${{ steps.toolchain.outputs.gcc }}-
      - name: Prepare the compiler cache
        run: |
          ccache --zero-stats
          ccache --show-config
      - name: Build the GLB export fixtures
        run: |
          cmake --preset dev
          cmake --build --preset dev --parallel 4 --target glb_export_tests texture_export_tests section_export_tests smooth_export_tests
      - name: GLB validator and Blender interoperability
        run: scripts/ci-blender-interop.sh 4
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose
