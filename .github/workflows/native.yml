      - name: Save the compiler cache
        # A failed build still saves its objects, so the rerun after a fix starts warm.
        if: ${{ !cancelled() && steps.ccache-restore.outcome == 'success' && (github.event_name != 'pull_request' || steps.ccache-restore.outputs.cache-matched-key == '') }}
        uses: actions/cache/save@v5
        with:
          path: /ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}
  # ---------------------------------------------------------------------------------------
  # The one check merges wait on. It fails when any job failed or was cancelled, and when a
  # job the plan selected did not succeed (so a wrong condition cannot skip tests silently).
  verdict:
    name: CI verdict
    if: always()
    needs: [plan, compile, fast, fast-x11, build, x11-1x, x11-2x, wayland-1x, wayland-2x, audit, fractional, blender, sanitize, ifc, package, qt68]
    runs-on: ubuntu-latest
