<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SketchyUp IFC exchange mockups (R097.e)</title>
<!-- Static illustrations of docs/UX_DESIGN.md section 16, not application code.
     Open ifc.html for every screen, or ifc.html?screen=<name> for one 1280 x 860 frame:
     menu, options, dirty, progress, report, after, far, size, unavailable, limited, export, exported.
     Colours are the light theme of src/app/theme.hpp, as in terrain.html.
     The import report is shaped like the R097.b helper's output on the buildingSMART IFC4 Architecture sample
     (371 entities, 21 + 339 + 11); its counts, the uncut wall, the notices, the alignments and the
     georeferencing result are illustrative (fixtures openings-hard and the sample's own 60 degree map
     conversion, R097.c). Notice texts are the report's own (src/io/ifc_import.cpp). -->
<style>
:root {
  --surface: #f7f7f2; --ink: #263a32; --border: #c9d4c5; --selected: #dce7dc; --hover: #e6ebdf;
  --input: #ffffff; --accent: #547858; --muted: #617266; --canvas: #f0f1ec;
  --sel: #5b5bd6; --warn: #7a4f00; --warn-bg: #fdf3dc; --warn-line: #e3b75c;
  --fail: #a8322b; --fail-bg: #fbf1f0; --info: #2c5aa0; --info-bg: #eef3fb; --ok: #547858; --ok-bg: #dce7dc;
}
* { box-sizing: border-box; }
body { margin: 0; background: #d9dcd3; font: 12px/1.35 "DejaVu Sans", "Noto Sans", "Liberation Sans", sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }
body.one { background: var(--surface); }
.gallery { padding: 24px; display: flex; flex-direction: column; gap: 28px; align-items: center; }
.gallery h2 { margin: 0 0 6px; font-size: 15px; }
.gallery p { margin: 0 0 10px; max-width: 1280px; color: #3d4a42; }
.frame { width: 1280px; height: 860px; position: relative; overflow: hidden; background: var(--surface); box-shadow: 0 4px 24px rgba(0,0,0,.18); display: grid; grid-template-rows: 34px 48px 1fr 50px; }
kbd { font: inherit; font-size: 11px; padding: 0 4px; border: 1px solid var(--border); border-radius: 3px; background: var(--input); color: var(--muted); }
u { text-decoration: underline; }

/* Application chrome (as terrain.html) */
.menubar { display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.menubar span { padding: 4px 9px; border-radius: 4px; }
.menubar span.open { background: var(--selected); }
.header { display: flex; align-items: center; gap: 10px; padding: 0 9px 0 25px; border-bottom: 1px solid var(--border); }
.wordmark { font-weight: 700; letter-spacing: 2.4px; font-size: 12px; margin-right: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; background: var(--input); }
.seg span { padding: 3px 14px; border-left: 1px solid var(--border); white-space: nowrap; }
.seg span:first-child { border-left: 0; }
.seg span.on { background: var(--accent); color: #fff; font-weight: 700; }
.doc i { font-style: normal; color: var(--muted); }
.cmd { margin-left: auto; border: 1px solid var(--border); border-radius: 5px; padding: 6px 11px; background: var(--input); }
main { display: grid; grid-template-columns: 88px 1fr 8px 246px; min-height: 0; }
.rail { border-right: 1px solid var(--border); padding: 5px 6px; display: flex; flex-direction: column; }
.rail span { height: 41px; display: grid; place-items: center; border-radius: 5px; }
.rail span.on { background: var(--selected); }
.rail span.grp { margin-top: 6px; border-top: 1px solid var(--border); border-radius: 0 0 5px 5px; height: 46px; }
.viewport { position: relative; background: var(--canvas); overflow: hidden; }
.viewport svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.crumb { position: absolute; left: 24px; top: 14px; color: var(--accent); text-decoration: underline; }
.splitter { border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--hover); }
.side { padding: 12px 8px 8px; display: flex; flex-direction: column; min-height: 0; }
.side .caps { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; padding: 6px 4px 8px; }
.side .selsum { padding: 0 1px 8px; }
.tabs { display: flex; gap: 2px; padding-bottom: 2px; }
.tabs span { padding: 5px 12px; border-radius: 4px; }
.tabs span.on { background: var(--selected); }
.panel { border: 1px solid var(--border); border-radius: 2px; flex: 1; min-height: 0; overflow: hidden; padding: 4px 0; background: var(--surface); }
.sec h3 { margin: 0; padding: 7px 11px; font-size: 12px; display: flex; align-items: center; gap: 6px; }
.sec h3::before { content: "▾"; font-size: 10px; }
.sec h3 .n { margin-left: auto; font-weight: 400; color: var(--muted); }
.sec .body { padding: 0 6px 6px 11px; }
.trow { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 4px 11px; border-top: 1px solid #edf0ea; }
.trow:first-of-type { border-top: 0; }
.trow .c { color: var(--muted); }
.trow .s { min-width: 66px; text-align: right; }
.trow .s b { font-weight: 400; }
.trow.dim { color: var(--muted); }
.kvs { display: grid; grid-template-columns: 74px 1fr; gap: 0 6px; padding: 2px 0; }
.hint2 { color: var(--muted); font-size: 11px; padding: 6px 4px 0; }
.status { display: flex; align-items: center; gap: 10px; padding: 0 9px; border-top: 1px solid var(--border); white-space: nowrap; }
.status .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.status .meas { display: flex; align-items: center; gap: 7px; }
.status .meas span.box { width: 150px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 3px; background: var(--input); color: #9aa49b; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 14px; }
.chip b { color: var(--warn); }
.chip .link { color: var(--accent); text-decoration: underline; }
.menu { position: absolute; top: 31px; background: var(--input); border: 1px solid var(--border); border-radius: 5px; box-shadow: 0 8px 26px rgba(30,45,35,.18); padding: 4px 0; min-width: 300px; z-index: 5; }
.menu div { display: flex; justify-content: space-between; gap: 24px; padding: 3px 14px 3px 26px; position: relative; }
.menu div.on { background: var(--selected); }
.menu div.new { background: var(--hover); }
.menu div.new::after { content: "new"; position: absolute; left: 4px; top: 5px; font-size: 8px; color: var(--ink); font-weight: 700; letter-spacing: .4px; }
.menu div.off { color: #9aa49b; }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.palette { position: absolute; z-index: 5; left: 560px; top: 31px; width: 420px; background: var(--input); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 8px 26px rgba(30,45,35,.18); }
.palette .q { padding: 8px 12px; border-bottom: 1px solid var(--border); }
.palette .q i { font-style: normal; border-right: 1.5px solid var(--ink); margin-left: 1px; }
.palette .r { display: flex; justify-content: space-between; padding: 5px 12px; }
.palette .r.on { background: var(--selected); }
.palette .r span:last-child { color: var(--muted); }
.mocknote { position: absolute; z-index: 6; padding: 3px 8px; border: 1px dashed var(--muted); border-radius: 3px; background: var(--surface); color: var(--muted); font-size: 11px; }

/* Dialogs */
.scrim { position: absolute; inset: 0; background: rgba(38,58,50,.38); z-index: 10; }
.dlg { position: absolute; z-index: 11; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 18px 60px rgba(20,35,28,.38); overflow: hidden; }
.dh { padding: 16px 22px 10px; }
.dt { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.ds { color: var(--muted); margin-top: 3px; }
.dbn { margin: 0 22px 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 5px; display: flex; gap: 10px; align-items: flex-start; }
.dbn.fail { background: var(--fail-bg); border-color: var(--fail); } .dbn.fail .k { color: var(--fail); }
.dbn.warn { background: var(--warn-bg); border-color: var(--warn-line); } .dbn.warn .k { color: var(--warn); }
.dbn.info { background: var(--info-bg); border-color: #9db8dd; } .dbn.info .k { color: var(--info); }
.dbn.ok { background: var(--ok-bg); border-color: var(--accent); } .dbn.ok .k { color: var(--ink); }
.dbn .k { font-weight: 700; white-space: nowrap; }
.rule { border-top: 1px solid var(--border); }
.dbody { flex: 1; min-height: 0; display: flex; }
.col { padding: 14px 22px; overflow: hidden; }
.col + .col { border-left: 1px solid var(--border); }
.hd { font-weight: 700; margin: 12px 0 6px; }
.hd:first-child { margin-top: 0; }
.fld { display: grid; grid-template-columns: 138px 1fr; gap: 6px 10px; padding: 3px 0; align-items: start; }
.fld > label { color: var(--muted); padding-top: 3px; }
.in { display: inline-block; padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--input); min-width: 150px; }
.in.dd::after { content: "  ▾"; color: var(--muted); }
.in.off { color: #9aa49b; background: var(--surface); }
.in.foc { border: 2px solid var(--accent); padding: 2px 7px; }
.cap { color: var(--muted); font-size: 11px; margin-top: 2px; }
.rb { position: relative; padding: 1px 0 1px 22px; margin: 2px 0; }
.rb::before { content: ""; position: absolute; left: 2px; top: 3px; width: 12px; height: 12px; border: 1.5px solid var(--muted); border-radius: 50%; background: var(--input); }
.rb.on::before { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 3.5px, var(--input) 4px); }
.rb.off { color: #9aa49b; }
.rb b { font-weight: 700; }
.ok { color: var(--ok); } .bad { color: var(--fail); } .wr { color: var(--warn); }
.df { display: flex; align-items: center; gap: 10px; padding: 10px 22px 16px; border-top: 1px solid var(--border); }
.df .st { flex: 1; color: var(--muted); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--input); white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn.off { color: #9aa49b; background: var(--surface); }
.btn.def { outline: 2px solid var(--surface); outline-offset: -4px; }
.btn.flat { border-color: transparent; background: none; color: var(--accent); text-decoration: underline; padding: 2px 4px; }
.pill { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 11px; font-weight: 700; border: 1px solid; vertical-align: 1px; }
.pill.warn { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }
.pill.fail { color: var(--fail); border-color: var(--fail); background: var(--fail-bg); }
.pill.info { color: var(--info); border-color: #9db8dd; background: var(--info-bg); }
.pill.ok { color: var(--ink); border-color: var(--border); background: var(--hover); }
ol.steps { margin: 4px 0 0; padding-left: 20px; } ol.steps li { margin: 5px 0; }
ul.plain { margin: 4px 0 0; padding-left: 18px; } ul.plain li { margin: 3px 0; }
.mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; }
.codebox { margin: 6px 0; padding: 6px 10px; border: 1px solid var(--border); background: var(--input); border-radius: 4px; display: flex; justify-content: space-between; align-items: center; }

/* Progress */
.stepl { margin: 4px 0 0; }
.stepl > div { display: grid; grid-template-columns: 22px 1fr auto; gap: 6px; padding: 5px 0; border-top: 1px solid #edf0ea; align-items: center; }
.stepl > div:first-child { border-top: 0; }
.stepl .g { text-align: center; color: var(--muted); }
.stepl .now { font-weight: 700; }
.stepl .now .g { color: var(--accent); }
.stepl .w { color: var(--muted); }
.bar { height: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--input); overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* Report */
.kv { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; padding: 2px 0; }
.kv span:last-child { text-align: right; }
.acc { margin: 6px 0 4px; display: flex; height: 18px; border: 1px solid var(--ink); border-radius: 3px; overflow: hidden; }
.acc i { display: block; height: 100%; }
.acc .a { background: var(--ink); width: 8%; }
.acc .b { background: repeating-linear-gradient(135deg, #fff 0 3px, #c9d4c5 3px 5px); }
.acc .c { background: repeating-linear-gradient(45deg, #fff 0 2px, var(--warn) 2px 4px); width: 6%; border-left: 1px solid var(--ink); }
.legend2 div { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px; padding: 2px 0; }
.sw { display: inline-block; width: 14px; height: 10px; border: 1px solid var(--ink); vertical-align: -1px; }
.sw.a { background: var(--ink); } .sw.b { background: repeating-linear-gradient(135deg, #fff 0 2px, #c9d4c5 2px 4px); } .sw.c { background: repeating-linear-gradient(45deg, #fff 0 2px, var(--warn) 2px 4px); }
.tree { border: 1px solid var(--border); background: var(--input); height: 100%; overflow: hidden; position: relative; }
.tree .tr { padding: 3px 22px 3px 10px; display: flex; gap: 8px; align-items: baseline; }
.tree .tr.g { background: var(--hover); font-weight: 700; border-top: 1px solid var(--border); padding: 5px 22px 5px 10px; }
.tree .tr.g:first-child { border-top: 0; }
.tree .tr.g .n { margin-left: auto; font-weight: 400; color: var(--muted); }
.tree .tr .tw { width: 10px; color: var(--muted); font-size: 10px; }
.tree .tr.sel { background: color-mix(in srgb, var(--sel) 13%, white); box-shadow: inset 2px 0 var(--sel); }
.tree .sub { color: var(--muted); padding: 0 22px 3px 10px; }
.tree .sub .btn { margin-top: 3px; }
.tree .d1 { padding-left: 26px; } .tree .d2 { padding-left: 44px; } .tree .sub.d1 { padding-left: 44px; } .tree .sub.d2 { padding-left: 62px; }
.tree .scroll { position: absolute; right: 0; top: 0; bottom: 0; width: 11px; background: var(--hover); border-left: 1px solid var(--border); }
.tree .scroll i { position: absolute; left: 1px; right: 1px; top: 2px; height: 56%; background: #b9c6b5; border-radius: 4px; }
.sfx { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
<script>
(() => {
const f1 = n => n.toFixed(1);

// ---------- The model behind the dialogs: a small isometric building (1280 x 860 frame, viewport 938 x 728) ----------
const S = 21, OX = 433, OY = 262;
const P = (x, y, z = 0) => [(x - y) * 0.866 * S + OX, (x + y) * 0.5 * S - z * S + OY];
const pt = (x, y, z) => P(x, y, z).map(f1).join(',');
const poly = (a, fill, stroke = '#263a32', sw = 1, extra = '') => `<polygon points="${a.map(p => pt(...p)).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" ${extra}/>`;
const rectFront = (x, w, z1, z2, y = 8) => [[x, y, z1], [x + w, y, z1], [x + w, y, z2], [x, y, z2]];
const rectRight = (y, w, z1, z2, x = 12) => [[x, y, z1], [x, y + w, z1], [x, y + w, z2], [x, y, z2]];
function label(x, y, lines, cls = '') {
  lines = [].concat(lines);
  const w = Math.max(...lines.map(t => t.replace(/<[^>]+>/g, '').length)) * 7.1 + 18, h = lines.length * 16 + 8;
  return `<g class="lbl ${cls}" transform="translate(${f1(x)},${f1(y)})"><rect x="0" y="0" width="${f1(w)}" height="${h}" rx="4"/>` +
    lines.map((t, n) => `<text x="9" y="${17 + n * 16}">${t}</text>`).join('') + '</g>';
}
// o.uncut: the wall (x 3 to 9 on the front) is drawn without its window, selected, with the hidden opening dashed.
function scene(o = {}) {
  let s = '';
  for (let x = -4; x <= 18; x += 2) s += `<polyline points="${pt(x, -4, 0)} ${pt(x, 14, 0)}" fill="none" stroke="#dfe2d9"/>`;
  for (let y = -4; y <= 14; y += 2) s += `<polyline points="${pt(-4, y, 0)} ${pt(18, y, 0)}" fill="none" stroke="#dfe2d9"/>`;
  s += poly([[0, 0, 0], [12, 0, 0], [12, 8, 0], [0, 8, 0]], '#e6e6dc', '#9aa49b');
  s += poly([[12, 0, 0], [12, 8, 0], [12, 8, 3], [12, 0, 3]], '#dcdfd6');
  s += poly([[0, 8, 0], [12, 8, 0], [12, 8, 3], [0, 8, 3]], '#eceee7');
  const windows = o.uncut ? [1.0, 10.0] : [1.0, 4.6, 10.0];
  for (const x of windows) s += poly(rectFront(x, 1.4, 1, 2.2), '#b6cbd6');
  for (const y of [1.2, 5.2]) s += poly(rectRight(y, 1.4, 1, 2.2), '#b6cbd6');
  s += poly(rectFront(7.8, 1.0, 0, 2.1), '#c9bfae');
  // roof slab with an overhang
  s += poly([[12.5, -0.5, 3], [12.5, 8.5, 3], [12.5, 8.5, 3.3], [12.5, -0.5, 3.3]], '#d2d5ca');
  s += poly([[-0.5, 8.5, 3], [12.5, 8.5, 3], [12.5, 8.5, 3.3], [-0.5, 8.5, 3.3]], '#e0e2d8');
  s += poly([[-0.5, -0.5, 3.3], [12.5, -0.5, 3.3], [12.5, 8.5, 3.3], [-0.5, 8.5, 3.3]], '#fbfbf8');
  if (o.uncut) {
    s += poly([[3, 8, 0], [7.2, 8, 0], [7.2, 8, 3], [3, 8, 3]], 'rgba(91,91,214,.10)', '#5b5bd6', 2.4);
    s += poly(rectFront(4.6, 1.5, 1, 2.2, 8.02), 'none', '#7a4f00', 1.6, 'stroke-dasharray="5 3"');
    const [lx, ly] = P(4.6, 8, 2.9);
    s += `<g class="mockann" transform="translate(${f1(lx - 250)},${f1(ly - 70)})"><rect width="236" height="40" rx="3" fill="#f7f7f2" stroke="#617266" stroke-dasharray="4 3"/><text x="8" y="16" fill="#617266" font-size="11">Mockup annotation: where the hidden</text><text x="8" y="31" fill="#617266" font-size="11">opening is (a hidden tag draws nothing)</text></g>`;
    s += `<polyline points="${f1(lx - 30)},${f1(ly - 30)} ${f1(lx + 8)},${f1(ly + 26)}" stroke="#617266" stroke-width="1" stroke-dasharray="3 3"/>`;
  }
  return `<svg class="scene" viewBox="0 0 938 728" preserveAspectRatio="xMidYMid meet"><style>
    .lbl rect { fill: #f7f7f2; stroke: #c9d4c5; } .lbl text { fill: #263a32; font: 12px "DejaVu Sans", sans-serif; }
    .lbl.sel rect { fill: #fff; stroke: #5b5bd6; stroke-width: 1.5; }</style>${s}</svg>`;
}

// ---------- Chrome ----------
const MENUS = ['<u>F</u>ile', '<u>E</u>dit', '<u>D</u>raw', '<u>T</u>errain', '<u>C</u>amera', 'E<u>x</u>tensions', '<u>V</u>iew'];
const menubar = open => `<div class="menubar">${MENUS.map((m, n) => `<span class="${n === open ? 'open' : ''}">${m}</span>`).join('')}</div>`;
const header = (name, state) => `<div class="header"><span class="wordmark">SKETCHYUP</span><span class="seg"><span class="on">Model</span><span>Sheets</span></span>
  <span class="doc">${name} &nbsp;·&nbsp; <i>${state}</i></span><span class="cmd">Commands &nbsp;Ctrl+K</span></div>`;
const RAIL = ['Select', 'Paint', 'Line', 'Rect', 'Circle', 'Push/pull', 'Offset', 'Follow', 'Intersect', 'Solids', 'Orient', 'Move', 'Rotate', 'Scale', 'Tape'];
const rail = `<nav class="rail">${RAIL.map((t, n) => `<span class="${n === 0 ? 'on' : ''}">${t}</span>`).join('')}<span class="grp">Terrain ▸</span></nav>`;
const status = (msg, extra = '') => `<div class="status"><span class="msg">${msg}</span>${extra}<span class="meas">Measurements · m<span class="box">distance</span></span></div>`;
const side = (sum, tab, panel) => `<aside class="side"><div class="caps">MODEL</div><div class="selsum">${sum}</div>
  <div class="tabs"><span class="${tab === 'Outliner' ? 'on' : ''}">Outliner</span><span class="${tab === 'Tags' ? 'on' : ''}">Tags</span><span class="${tab === 'Info' ? 'on' : ''}">Info</span><span>M ‹ ›</span></div><div class="panel">${panel}</div>
  <div class="hint2">Middle drag: orbit<br>Right drag: pan · Wheel: zoom</div></aside>`;
const outliner = items => items.map(([d, n, k]) => `<div class="trow" style="padding-left:${11 + d * 14}px"><span>${d === 0 ? '▾ ' : ''}${n}</span><span class="c">${k}</span><span></span></div>`).join('');
const OUT_HOUSE = outliner([[0, 'House', 'Group'], [1, 'Walls', 'Group'], [1, 'Roof', 'Group'], [1, 'Windows', 'Group'], [1, 'Door', 'Component']]);
const frame = (menuOpen, name, state, view, sidebar, stat, overlay = '') =>
  `<div class="frame">${menubar(menuOpen)}${header(name, state)}<main>${rail}<section class="viewport">${view}<div class="crumb">Model</div></section><div class="splitter"></div>${sidebar}</main>${stat}${overlay}</div>`;
const dlg = (w, h, inner, o = {}) => `<div class="scrim" style="z-index:${o.z ?? 10};${o.light ? 'background:rgba(38,58,50,.2)' : ''}"></div><div class="dlg" role="dialog" aria-modal="true" ${o.name ? `aria-label="${o.name}"` : ''} style="z-index:${(o.z ?? 10) + 1};width:${w}px;height:${h}px;left:${(1280 - w) / 2}px;top:${o.top ?? (860 - h) / 2}px">${inner}</div>`;
const backdrop = (state = 'Edited', extra = {}) => frame(-1, 'house', state, scene(), side('House', 'Outliner', OUT_HOUSE), status(extra.msg || 'Ready'));

// ---------- Dialog parts ----------
const FILE = 'bsi-ifc4-arch.ifc';
const head = (title, sub, pill = '') => `<div class="dh"><div class="dt" id="dt">${title}${pill}</div><div class="ds">${sub}</div></div>`;
const banner = (kind, key, html) => `<div class="dbn ${kind}" role="${kind === 'fail' ? 'alert' : 'status'}"><span class="k">${key}</span><span>${html}</span></div>`;
const foot = (status, buttons) => `<div class="df"><span class="st">${status}</span>${buttons}</div>`;
const btn = (t, c = '') => `<span class="btn ${c}" role="button">${t}</span>`;

// Import options, in three states: ok, size (refused before starting), limited (kernel missing).
function optionsDialog(state = 'ok') {
  const size = state === 'size';
  const fileName = size ? 'campus-model.ifc' : FILE;
  const facts = size
    ? `<div class="fld"><label>Size</label><span><b class="bad">144.5 MiB</b> — over the 128 MiB limit</span></div>
       <div class="fld"><label>Schema</label><span>Not read: the file is refused first</span></div>`
    : `<div class="fld"><label>Size</label><span>139 KiB <span class="sfx">(limit 128 MiB)</span></span></div>
       <div class="fld"><label>Schema</label><span><b>IFC4</b> <span class="ok">✓ supported</span> <span class="sfx">· IFC2x3, IFC4 and IFC4.3 import</span></span></div>
       <div class="fld"><label>Written by</label><span>BIM_Tools - Sketchup_IFC_manager - 5.6.0 <span class="sfx">· Reference View 1.2</span></span></div>`;
  const off = size ? ' off' : '';
  const banners = size
    ? banner('fail', '✕ Refused', 'Nothing can be imported from this file. <b>The IFC file is larger than 128 MiB (151,478,272 bytes).</b> Your model is unchanged.')
    : state === 'limited'
      ? banner('warn', '⚠ Limited', '<b>The geometry kernel (OpenCASCADE) cannot be loaded.</b> Files whose shapes are already triangulated import normally. Extruded, clipped and other solid shapes will be listed as not imported. Export is not affected. Reinstall the <span class="mono">sketchyup-ifc</span> package to restore full import.')
      : '';
  const sizeHelp = `<div class="hd">What to do next</div>
      <ol class="steps"><li>Export a smaller file from the program that made it: one building, one storey or one discipline at a time, or without furniture and equipment.</li>
        <li>Or choose another file.</li></ol>
      <div class="hd">Limits that are checked later</div>
      <ul class="plain"><li>2,000,000 entities in the file</li><li>100,000 vertices or faces in one body, and in the whole model</li><li>10,000 bodies in the model</li></ul>
      <div class="cap" style="font-size:12px;margin-top:6px">After reading, the report names any limit that cut something out, and which elements it affected.</div>`;
  const body = `<div class="dbody">
    <div class="col" style="width:520px">
      <div class="hd">File</div>
      <div class="fld"><label for="f">Source</label><span style="display:flex;gap:8px;align-items:center"><span class="in" id="f" style="min-width:${size ? 150 : 200}px">${fileName}</span> ${btn(size ? 'Choose another file…' : 'Choose…', size ? 'def' : '')}</span></div>
      ${facts}
      <div class="hd">Units</div>
      <div class="fld${off}"><label>Length unit</label><span><b>Read from the file.</b><div class="cap">Only if the file declares none: <span class="in dd${size ? ' off' : ''}" style="min-width:128px;margin-left:4px">Refuse the import</span></div></span></div>
      <div class="hd">Spaces <span class="sfx">(rooms and zones: volumes that cover the building when shown)</span></div>
      <div class="rb on${off}" role="radio" aria-checked="true"><b>Hidden</b> <span class="sfx">on the tag IFC Space; switch it on in Tags</span></div>
      <div class="rb${off}" role="radio" aria-checked="false">Shown</div>
      <div class="rb${off}" role="radio" aria-checked="false">Skip <span class="sfx">— do not import spaces</span></div>
      <div class="hd">Georeferencing</div>
      <div class="rb on${off}" role="radio" aria-checked="true"><b>Keep the file's axes</b></div>
      <div class="rb${off}" role="radio" aria-checked="false"><b>Grid-aligned</b> <span class="sfx">opt in</span></div>
      <div class="cap" style="margin-left:22px;margin-top:4px">If the file's map conversion is a plain shift, the site origin is set from it in both modes. If it rotates, Keep records it and sets no site origin; Grid-aligned rotates the model so +X points east and sets the origin, which turns the walls off the model axes. A conversion with a scale, map-unit or context mismatch is recorded and not applied in either mode. A model with a site origin opens only in SketchyUp 1.3.0 or later.</div>
      <div class="hd">Curved surfaces</div>
      <div class="fld${off}"><label>Maximum deviation</label><span><span class="in" style="min-width:90px">1.00 mm</span><div class="cap">Finer curves make more faces. A body keeps at most 100,000.</div></span></div>
    </div>
    <div class="col" style="flex:1">
      ${size ? sizeHelp : `<div class="hd">What import does</div>
      <ul class="plain">
        <li>Opens the file as a <b>new unsaved model</b>. The IFC file is never changed.</li>
        <li>Turns every shape into ordinary, editable faces. Nothing stays parametric.</li>
        <li>Keeps names, classes and property sets as properties you can read in Info (<span class="mono">ifc.Class</span>, <span class="mono">Pset_WallCommon.FireRating</span>).</li>
        <li>Cuts door and window openings into walls where it can, and says where it could not.</li>
        <li>Never guesses: an element it cannot place or scale is left out and listed, not put at the origin.</li>
        <li>Ends with a <b>report</b> that accounts for every entity in the file.</li>
      </ul>
      <div class="hd">The helper</div>
      <div class="cap" style="font-size:12px">${state === 'limited' ? '<span class="wr">⚠</span> IfcOpenShell 0.9.0 · kernel: none (triangulated shapes only)' : '<span class="ok">✓</span> IfcOpenShell 0.9.0 · OpenCASCADE kernel'}<br>IFC is read in a separate process with its own time and memory limits (up to 2 minutes). Cancel ends it.</div>`}
    </div></div>`;
  return dlg(860, size ? 790 : state === 'limited' ? 800 : 730,
    head('Import IFC', 'Opens the file as a new unsaved model. The IFC file is never changed.') + banners + `<div class="rule"></div>` + body +
    foot(size ? 'Import is unavailable for this file.' : 'Ready. The helper starts when you press Import.',
      btn('Cancel') + btn('Import', size ? 'primary off' : 'primary def')), { name: 'Import IFC' });
}

// The report body: left summary, right grouped list.
function reportBody(r) {
  return `<div class="dbody">
    <div class="col" style="width:330px">
      <div class="hd">${r.came}</div>${r.cameRows}
      <div class="hd">${r.accHead || 'Every entity is accounted for'}</div>
      <div class="cap" style="margin:0">${r.accText}</div>
      <div class="acc" role="img" aria-label="${r.accLabel}">${r.accW ? `<i class="a" style="width:${r.accW[0]}%"></i><i class="b" style="width:${r.accW[1]}%"></i><i class="c" style="width:${r.accW[2]}%"></i>` : '<i class="a"></i><i class="b" style="flex:1"></i><i class="c"></i>'}</div>
      <div class="legend2">${r.legend}</div>
      <div class="kv" style="border-top:1px solid var(--border);margin-top:4px;padding-top:5px"><span><b>${r.sum}</b></span><span class="ok">✓ balanced</span></div>
      <div class="hd">${r.how}</div>${r.howRows}
    </div>
    <div class="col" style="flex:1;padding:14px 16px 14px 18px"><div class="tree" role="tree" aria-label="${r.treeName}">${r.tree}<div class="scroll"><i></i></div></div></div>
  </div>`;
}
const kv = (a, b, cls = '') => `<div class="kv"><span>${a}</span><span class="${cls}">${b}</span></div>`;
const grp = (kind, label, n, open = true) => `<div class="tr g" role="treeitem" aria-expanded="${open}"><span class="tw">${open ? '▾' : '▸'}</span><span class="pill ${kind}">${kind === 'warn' ? 'Attention' : kind === 'info' ? 'Notice' : kind === 'fail' ? 'Refused' : 'Info'}</span><span>${label}</span><span class="n">${n}</span></div>`;
const it = (d, html, sel = false) => `<div class="tr d${d}${sel ? ' sel' : ''}" role="treeitem">${html}</div>`;
const sub = (d, html) => `<div class="sub d${d}">${html}</div>`;

          <li>In the program that made the file, move the model close to the project origin (often called the project base point or a local origin) and export it again.</li>
          <li>Keep the real-world position as the file's map conversion. SketchyUp reads that separately and can set the site origin from it.</li>
        </ol>
        <div class="cap" style="margin-top:6px;font-size:12px">SketchyUp does not shift the model for you in this version: that would change where it is without telling you.</div></div></div>` +
      foot('Esc closes.', btn('Copy details') + btn('Save report…') + btn('Choose another file…') + btn('Close', 'primary def'));
    return frame(-1, 'house', 'Edited', scene(), side('House', 'Outliner', OUT_HOUSE), status('IFC import refused: nothing was imported'), dlg(700, 530, inner, { name: 'IFC import refused' }));
  },
};

SCREENS.size = {
  title: '8 · Refused: the file is over the size budget',
  note: 'The cheap checks (a regular file, at most 128 MiB, a STEP header, one supported schema, not a zip, XML or JSON) run in the application as soon as the file is chosen, in under a second, so these refusals appear <b>inside the Import dialog</b> and never start the helper. The banner states the number and the limit, the settings are greyed (not hidden) so nothing seems to have disappeared, and Import is disabled. "Choose another file…" is focused. The limits that can only be known after reading (2,000,000 entities; 100,000 faces in a body; 10,000 bodies in the model) are reported by the sheet of screen 7 or, for single elements, in the report\'s Not imported list.',
  html: () => frame(-1, 'house', 'Edited', scene(), side('House', 'Outliner', OUT_HOUSE), status('Import IFC'), optionsDialog('size')),
};

SCREENS.limited = {
  title: '10 · Limited: the helper is there, the geometry kernel is not',
  note: 'The helper probes for the kernel when the dialog opens, because the library aborts rather than failing cleanly when a kernel plugin cannot load. If only the OpenCASCADE libraries are missing or damaged, Import stays available for files made of triangles (most IFC4 exports from modeling tools) and the amber banner says what will be left out; the report then carries the same wording as a notice and lists each shape that could not be read. Export does not use the kernel and is unaffected. The helper line below the options changes from ✓ to ⚠.',
  html: () => frame(-1, 'house', 'Edited', scene(), side('House', 'Outliner', OUT_HOUSE), status('Import IFC'), optionsDialog('limited')),
};

// Export
SCREENS.export = {
  title: '11 · Export IFC: what will be written, what will not',
  note: 'The scope notice of ADR 0171 §5, as a short form that is computed from the open model before anything is written. <b>Written</b> lists the mapping in counts. <b>Not written</b> counts each kind of thing IFC cannot carry here (terrain, guides, text and dimensions, sections, scenes, sheets, reference images, component parameters, textures, loose edges and curves) so nobody finds out afterwards. <b>Georeferencing</b> says in advance whether the site origin and CRS will be written; here the label "Local grid" is not an authority code such as EPSG:32760, so neither the CRS nor the map conversion will be, and the amber line says how to change that. There are no options: IFC4, tessellated, whole model, no claim of certification (stated). <b>Export to file…</b> opens the system Save dialog, which never replaces an existing file.',
  html: () => {
    const row = (a, b, cls = '') => `<div class="fld"><label>${a}</label><span class="${cls}">${b}</span></div>`;
    const inner = head('Export IFC', 'Writes a new IFC4 file from this model. The model is not changed.') + '<div class="rule"></div>' +
      `<div class="dbody"><div class="col" style="width:470px">
        <div class="hd">Written</div>
        ${row('Structure', '1 site and 1 building are created; no storeys are invented')}
        ${row('Groups', '6, as assemblies')}
        ${row('Bodies', '31, as triangulated shapes. Class from ifc.Class, otherwise IfcBuildingElementProxy')}
        ${row('Components', '12 placements, written as separate geometry (no instancing yet)')}
        ${row('Colours', '5 materials, with per-face colours')}
        ${row('Properties', '214, as property sets; keys without a dot go in a set named SketchyUp')}
        ${row('Hidden things', 'Written, on a layer that is switched off')}
        ${row('Identifiers', 'GlobalIds are kept from an import where valid and unique; the others are derived from the model, so exporting twice gives the same ids')}
      </div><div class="col" style="flex:1">
        <div class="hd">Not written <span class="sfx">(counted in the report)</span></div>
        ${kv('Terrain', '1')}${kv('Guides', '14')}${kv('Text, dimensions, annotations', '6')}${kv('Sections', '2')}${kv('Scenes', '3')}${kv('Sheets', '1')}${kv('Reference images', '1')}${kv('Component parameters', '2')}${kv('Textures', '2')}${kv('Edges and curves not part of a face', '18')}
        <div class="hd">Georeferencing</div>
        <div class="dbn warn" style="margin:0"><span class="k">⚠ Not written</span><span>The site origin is set, but the label "Local grid" is not an authority code like <span class="mono">EPSG:32760</span>, so <b>neither the coordinate system nor the map conversion is written</b>, and the origin is lost in the file. Change the label in File → Site settings…</span></div>
        <div class="hd">What this is</div>

      </div></div>` +
      foot('A new file is created. An existing file is never replaced.', btn('Cancel') + btn('Export to file…', 'primary def'));
    return frame(-1, 'house', 'Saved', scene(), side('House', 'Outliner', OUT_HOUSE), status('Export IFC'), dlg(900, 640, inner, { name: 'Export IFC' }));
  },
};

const ORDER = ['menu', 'options', 'dirty', 'progress', 'report', 'after', 'far', 'size', 'unavailable', 'limited', 'export', 'exported'];
const one = new URLSearchParams(location.search).get('screen');
if (one && SCREENS[one]) { document.body.className = 'one'; document.body.innerHTML = SCREENS[one].html(); }
else document.body.innerHTML = `<div class="gallery">` + ORDER.map(k => `<div><h2>${SCREENS[k].title}</h2><p>${SCREENS[k].note}</p>${SCREENS[k].html()}</div>`).join('') + '</div>';
})();
