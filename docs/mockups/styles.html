<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SketchyUp styles, edge strokes and asset catalogs mockups (R100.f)</title>
<!-- Static illustrations of docs/UX_DESIGN.md section 18, not application code.
     Open styles.html for every screen, or styles.html?screen=<name> for one 1280 x 860 frame:
     menu, styles, texture, import, refused, export, save, materials, catalog, report, viewport.
     Add &text=200 for 200 % text (the layout reflows; dialogs scroll and keep their footer).
     Colours are the light theme of src/app/theme.hpp, as in ifc.html.
     Every name in these frames is a placeholder: the textured preset list, its textures and
     their licences are open question Q1 (ADR 0174), and no real style, texture or catalog is named.
     Numbers and file sizes are illustrative. The viewport draws nothing yet (R100.f). -->
<style>
:root {
  --surface: #f7f7f2; --ink: #263a32; --border: #c9d4c5; --selected: #dce7dc; --hover: #e6ebdf;
  --input: #ffffff; --accent: #547858; --muted: #617266; --canvas: #f0f1ec;
  --sel: #5b5bd6; --warn: #7a4f00; --warn-bg: #fdf3dc; --warn-line: #e3b75c;
  --fail: #a8322b; --fail-bg: #fbf1f0; --info: #2c5aa0; --info-bg: #eef3fb; --ok: #547858; --ok-bg: #dce7dc;
}
* { box-sizing: border-box; }
body { margin: 0; background: #d9dcd3; font: 12px/1.35 "DejaVu Sans", "Noto Sans", "Liberation Sans", sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }
body.one { background: var(--surface); }
.gallery { padding: 24px; display: flex; flex-direction: column; gap: 28px; align-items: center; }
.gallery h2 { margin: 0 0 6px; font-size: 15px; }
.gallery p { margin: 0 0 10px; max-width: 1280px; color: #3d4a42; }
.frame { width: 1280px; height: 860px; position: relative; overflow: hidden; background: var(--surface); box-shadow: 0 4px 24px rgba(0,0,0,.18); display: grid; grid-template-rows: 34px 48px 1fr 50px; }
kbd { font: inherit; font-size: 11px; padding: 0 4px; border: 1px solid var(--border); border-radius: 3px; background: var(--input); color: var(--muted); }
u { text-decoration: underline; }

/* Chrome, as ifc.html */
.menubar { display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.menubar span { padding: 4px 9px; border-radius: 4px; }
.menubar span.open { background: var(--selected); }
.header { display: flex; align-items: center; gap: 10px; padding: 0 9px 0 25px; border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden; }
.wordmark { font-weight: 700; letter-spacing: 2.4px; font-size: 12px; margin-right: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; background: var(--input); }
.seg span { padding: 3px 14px; border-left: 1px solid var(--border); white-space: nowrap; }
.seg span:first-child { border-left: 0; }
.seg span.on { background: var(--accent); color: #fff; font-weight: 700; }
.doc i { font-style: normal; color: var(--muted); }
.cmd { margin-left: auto; border: 1px solid var(--border); border-radius: 5px; padding: 6px 11px; background: var(--input); }
main { display: grid; grid-template-columns: 88px 1fr 8px 340px; min-height: 0; }
.rail { border-right: 1px solid var(--border); padding: 5px 6px; display: flex; flex-direction: column; font-size: 11px; }
.rail span { height: 41px; display: grid; place-items: center; border-radius: 5px; text-align: center; font-size: 11px; line-height: 1.1; overflow: hidden; }
.rail span.on { background: var(--selected); }
.rail hr { border: 0; border-top: 1px solid var(--border); margin: 6px 0; }
.viewport { position: relative; background: var(--canvas); overflow: hidden; }
.viewport svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
.crumb { position: absolute; left: 24px; top: 14px; color: var(--accent); text-decoration: underline; }
.splitter { border-left: 1px solid var(--border); border-right: 1px solid var(--border); background: var(--hover); }
.side { padding: 10px 8px 8px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.side .caps { font-size: 11px; font-weight: 700; letter-spacing: 1.4px; padding: 4px 4px 6px; }
.side .selsum { padding: 0 1px 8px; color: var(--muted); }
.tabs { display: flex; gap: 2px; padding-bottom: 4px; white-space: nowrap; }
.tabs span { padding: 5px 9px; border-radius: 4px; }
.tabs span.on { background: var(--selected); font-weight: 700; }
.panel { border: 1px solid var(--border); border-radius: 2px; flex: 1; min-height: 0; overflow: hidden; padding: 2px 0; background: var(--surface); }
.sec h3 { margin: 0; padding: 6px 10px; font-size: 12px; display: flex; align-items: center; gap: 6px; border-top: 1px solid #edf0ea; }
.sec:first-child h3 { border-top: 0; }
.sec h3::before { content: "▾"; font-size: 10px; }
.sec h3 .n { margin-left: auto; font-weight: 400; color: var(--muted); }
.sec .body { padding: 0 8px 8px 10px; }
.status { display: flex; align-items: center; gap: 10px; padding: 0 9px; border-top: 1px solid var(--border); white-space: nowrap; }
.status .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.status .meas { display: flex; align-items: center; gap: 7px; }
.status .meas span.box { width: 130px; padding: 6px 9px; border: 1px solid var(--border); border-radius: 3px; background: var(--input); color: #9aa49b; }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 4px 10px; border: 1px solid var(--warn-line); background: var(--warn-bg); border-radius: 14px; white-space: nowrap; }
.chip b { color: var(--warn); }
.chip .link { color: var(--accent); text-decoration: underline; }
.menu { position: absolute; top: 31px; background: var(--input); border: 1px solid var(--border); border-radius: 5px; box-shadow: 0 8px 26px rgba(30,45,35,.18); padding: 4px 0; min-width: 330px; z-index: 5; }
.menu div { display: flex; justify-content: space-between; gap: 24px; padding: 3px 14px 3px 26px; position: relative; white-space: nowrap; }
.menu div.on { background: var(--selected); }
.menu div.new { background: var(--hover); }
.menu div.new::after { content: "new"; position: absolute; left: 4px; top: 5px; font-size: 8px; color: var(--ink); font-weight: 700; letter-spacing: .4px; }
.menu div.off { color: #9aa49b; }
.menu hr { border: 0; border-top: 1px solid var(--border); margin: 4px 0; }
.mocknote { position: absolute; z-index: 6; padding: 3px 8px; border: 1px dashed var(--muted); border-radius: 3px; background: var(--surface); color: var(--muted); font-size: 11px; max-width: 420px; }

/* Side panel controls */

.fld > label { color: var(--muted); }
.in { display: inline-block; padding: 3px 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--input); min-width: 92px; }
.in.dd::after { content: "  ▾"; color: var(--muted); }
.in.foc { border: 2px solid var(--accent); padding: 2px 7px; }
.in.bad { border: 2px solid var(--fail); padding: 2px 7px; }
.in.wr { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }
.in.off { color: #9aa49b; background: var(--surface); }
.in.wide { min-width: 0; width: 100%; }
.sfx { color: var(--muted); font-size: 11px; }
.cap { color: var(--muted); font-size: 11px; margin-top: 2px; }
.cb { display: flex; align-items: center; gap: 0; padding: 2px 0; }
.cb::before { content: ""; display: inline-block; flex: none; width: 12px; height: 12px; border: 1.5px solid var(--muted); border-radius: 2px; background: var(--input); margin-right: 7px; }
.cb.on::before { background: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--input); }
.cb.off { color: #9aa49b; }
.checks { display: flex; flex-wrap: wrap; gap: 2px 9px; padding: 2px 0; }
.btnrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 2px; }
.lib { margin: 6px 0; border: 1px solid var(--border); background: var(--input); }
.lib .row { display: grid; grid-template-columns: 52px 1fr; gap: 0 8px; padding: 3px 8px; border-top: 1px solid #edf0ea; }
.lib .row:first-child { border-top: 0; }
.lib .row.sel { background: color-mix(in srgb, var(--sel) 13%, white); box-shadow: inset 2px 0 var(--sel); }
.lib .row small { color: var(--muted); display: block; }
.lib .row .st { font-size: 11px; }
.sample { width: 52px; height: 16px; align-self: center; }

/* Dialogs */
.scrim { position: absolute; inset: 0; background: rgba(38,58,50,.38); z-index: 10; }
.dlg { position: absolute; z-index: 11; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 18px 60px rgba(20,35,28,.38); overflow: hidden; }
.dh { padding: 16px 22px 10px; }
.dt { font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.ds { color: var(--muted); margin-top: 3px; }
.dbn { margin: 0 22px 10px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 5px; display: flex; gap: 10px; align-items: flex-start; }
.dbn.fail { background: var(--fail-bg); border-color: var(--fail); } .dbn.fail .k { color: var(--fail); }
.dbn.warn { background: var(--warn-bg); border-color: var(--warn-line); } .dbn.warn .k { color: var(--warn); }
.dbn.info { background: var(--info-bg); border-color: #9db8dd; } .dbn.info .k { color: var(--info); }

.dbn .k { font-weight: 700; white-space: nowrap; }
.rule { border-top: 1px solid var(--border); }
.dbody { flex: 1; min-height: 0; display: flex; }
.col { padding: 14px 22px; overflow: hidden; }
.col + .col { border-left: 1px solid var(--border); }
.hd { font-weight: 700; margin: 12px 0 6px; }
.hd:first-child { margin-top: 0; }
.dfld { display: grid; grid-template-columns: 138px 1fr; gap: 6px 10px; padding: 3px 0; align-items: start; }
.dfld > label { color: var(--muted); padding-top: 3px; }
.rb { position: relative; padding: 2px 0 2px 22px; margin: 4px 0; }
.rb::before { content: ""; position: absolute; left: 2px; top: 4px; width: 12px; height: 12px; border: 1.5px solid var(--muted); border-radius: 50%; background: var(--input); }
.rb.on::before { border-color: var(--accent); background: radial-gradient(circle, var(--accent) 0 3.5px, var(--input) 4px); }
.rb.off { color: #9aa49b; }
.rb b { font-weight: 700; }
.ok { color: var(--ok); } .bad { color: var(--fail); } .wr { color: var(--warn); }
.df { display: flex; align-items: center; gap: 10px; padding: 10px 22px 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
.df .st { flex: 1; color: var(--muted); min-width: 200px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 4px 12px; border: 1px solid var(--border); border-radius: 4px; background: var(--input); white-space: nowrap; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }
.btn.off { color: #9aa49b; background: var(--surface); }
.btn.def { outline: 2px solid var(--surface); outline-offset: -4px; }
.btn.flat { border-color: transparent; background: none; color: var(--accent); text-decoration: underline; padding: 2px 4px; }
.pill { display: inline-block; padding: 0 7px; border-radius: 9px; font-size: 11px; font-weight: 700; border: 1px solid; vertical-align: 1px; white-space: nowrap; }
.pill.warn { color: var(--warn); border-color: var(--warn-line); background: var(--warn-bg); }
.pill.fail { color: var(--fail); border-color: var(--fail); background: var(--fail-bg); }
.pill.info { color: var(--info); border-color: #9db8dd; background: var(--info-bg); }
.pill.ok { color: var(--ink); border-color: var(--border); background: var(--hover); }
ol.steps { margin: 4px 0 0; padding-left: 20px; } ol.steps li { margin: 5px 0; }
ul.plain { margin: 4px 0 0; padding-left: 18px; } ul.plain li { margin: 3px 0; }
.mono { font-family: "DejaVu Sans Mono", monospace; font-size: 11px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; padding: 2px 0; }
.kv span:last-child { text-align: right; }
.facts { border: 1px solid var(--border); background: var(--input); padding: 4px 10px; margin: 8px 0; }
.acc { margin: 6px 0 4px; display: flex; height: 18px; border: 1px solid var(--ink); border-radius: 3px; overflow: hidden; }
.acc i { display: block; height: 100%; }
.acc .a { background: var(--ink); } .acc .b { background: repeating-linear-gradient(135deg, #fff 0 3px, #c9d4c5 3px 5px); } .acc .c { background: repeating-linear-gradient(45deg, #fff 0 2px, var(--warn) 2px 4px); border-left: 1px solid var(--ink); }
.legend2 div { display: grid; grid-template-columns: 22px 1fr auto; gap: 4px; padding: 2px 0; }
.sw { display: inline-block; width: 14px; height: 10px; border: 1px solid var(--ink); vertical-align: -1px; }
.sw.a { background: var(--ink); } .sw.b { background: repeating-linear-gradient(135deg, #fff 0 2px, #c9d4c5 2px 4px); } .sw.c { background: repeating-linear-gradient(45deg, #fff 0 2px, var(--warn) 2px 4px); }
.tree { border: 1px solid var(--border); background: var(--input); height: 100%; overflow: hidden; position: relative; }
.tree .tr { padding: 3px 22px 3px 10px; display: flex; gap: 8px; align-items: baseline; }
.tree .tr.g { background: var(--hover); font-weight: 700; border-top: 1px solid var(--border); padding: 5px 22px 5px 10px; }
.tree .tr.g:first-child { border-top: 0; }
.tree .tr.g .n { margin-left: auto; font-weight: 400; color: var(--muted); }
.tree .tr .tw { width: 10px; color: var(--muted); font-size: 10px; flex: none; }
.tree .tr.sel { background: color-mix(in srgb, var(--sel) 13%, white); box-shadow: inset 2px 0 var(--sel); }
.tree .sub { color: var(--muted); padding: 0 22px 4px 10px; }
.tree .sub .btn { margin: 3px 6px 3px 0; }
.tree .d1 { padding-left: 26px; } .tree .sub.d1 { padding-left: 44px; }
.tree .sub b { color: var(--ink); }

/* Catalog list */
.lgroup { padding: 6px 10px; background: var(--hover); font-weight: 700; border-top: 1px solid var(--border); }
.lgroup:first-child { border-top: 0; }
.lgroup .sfx { font-weight: 400; }
.lrow { display: grid; grid-template-columns: 22px 1fr auto; gap: 2px 6px; padding: 5px 10px 5px 14px; border-top: 1px solid #edf0ea; align-items: baseline; }
.lrow .g { text-align: center; }
.lrow small { grid-column: 2 / 4; color: var(--muted); }
.lrow.sel { background: color-mix(in srgb, var(--sel) 13%, white); box-shadow: inset 2px 0 var(--sel); }
.lrow.blocked small { color: var(--fail); }
.lrow .k { color: var(--muted); }
.search { border: 1px solid var(--border); background: var(--input); border-radius: 4px; padding: 3px 8px; }

/* Pointer and popups */
.pop { position: absolute; z-index: 14; background: var(--input); border: 1px solid var(--border); border-radius: 4px; box-shadow: 0 8px 26px rgba(30,45,35,.22); padding: 3px 0; min-width: 240px; }
.pop div { padding: 4px 10px; white-space: nowrap; }
.pop div.hi { background: var(--selected); }
.pop div.gh { color: var(--muted); font-size: 11px; font-weight: 700; padding-top: 6px; }
.pop div.bad { color: var(--fail); }
.tip { position: absolute; z-index: 16; background: var(--ink); color: #fff; padding: 6px 10px; border-radius: 4px; max-width: 330px; font-size: 11.5px; line-height: 1.4; box-shadow: 0 6px 18px rgba(20,35,28,.3); }
.tip b { color: #ffd98a; font-weight: 700; }
.cursor { position: absolute; z-index: 17; width: 16px; height: 22px; pointer-events: none; }

/* Edge texture sample strip */
.legend { display: grid; grid-template-columns: 110px 1fr; gap: 4px 10px; }

/* 200 % text: the same frames, larger text, reflowed (UX_DESIGN 3.3, 10) */
body.t200 main { grid-template-columns: 88px 1fr 8px 420px; }
body.t200 .rail span { height: auto; min-height: 41px; }
body.t200 .dlg { overflow: hidden; }
body.t200 .dbody { flex-direction: column; overflow: auto; }
body.t200 .col { overflow: visible; }
body.t200 .col + .col { border-left: 0; border-top: 1px solid var(--border); }
body.t200 .dbody > .col { width: auto !important; flex: none; }
body.t200 .dh, body.t200 .df, body.t200 .dbn, body.t200 .rule { flex: none; }
body.t200 .pop { max-height: 250px; overflow: hidden; }
body.t200 .dlg.tall { height: 826px !important; top: 16px !important; }
body.t200 .dlg > .col { flex: 1 1 auto; min-height: 0; overflow: auto; }
body.t200 .dfld { grid-template-columns: 1fr; }
body.t200 .fld { grid-template-columns: 1fr; }
body.t200 .df { flex-wrap: wrap; }
body.t200 .btn { padding: 6px 12px; }
body.t200 .panel { overflow-y: auto; }
body.t200 .lib .row { grid-template-columns: 1fr; }
body.t200 .sample { display: none; }
body.t200 .menu { min-width: 480px; }
body.t200 .frame { grid-template-rows: auto auto minmax(0, 1fr) auto; }
body.t200 main, body.t200 .side { min-height: 0; overflow: hidden; }
body.t200 .menubar { flex-wrap: wrap; row-gap: 2px; }
body.t200 .header { flex-wrap: wrap; row-gap: 4px; padding: 6px 9px 6px 25px; overflow: visible; }
body.t200 .status { flex-wrap: wrap; padding: 6px 9px; row-gap: 4px; }
body.t200 .status .msg { flex: 1 1 280px; white-space: normal; overflow: visible; text-overflow: clip; }
body.t200 .status .meas { flex: 0 0 auto; }
body.t200 .tabs { flex-wrap: wrap; }
body.t200 .btn, body.t200 .in, body.t200 .pill, body.t200 .cmd { white-space: normal; }
body.t200 .btnrow { flex-wrap: wrap; }
body.t200 .rail span { overflow-wrap: anywhere; }
body.t200 .side .selsum { white-space: normal; }
</style>

<body>
<script>
(() => {
const params = new URLSearchParams(location.search);
const one = params.get('screen');
const big = params.get('text') === '200';

// ---------- The model: a small room (10 m x 7 m, 3 m high) drawn in isometric ----------
const S = 27, OX = 600, OY = 300;
const P = (x, y, z = 0) => [(x - y) * 0.866 * S + OX, (x + y) * 0.5 * S - z * S + OY];
const pt = (x, y, z) => P(x, y, z).map(n => n.toFixed(1)).join(',');
const face = (a, fill) => `<polygon points="${a.map(p => pt(...p)).join(' ')}" fill="${fill}" stroke="none"/>`;
const edge = (a, b, kind) => `<polyline points="${pt(...a)} ${pt(...b)}" fill="none" class="e ${kind}"/>`;
const DEFS = `<defs>
  <pattern id="hatchWarn" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fdf3dc"/><line x1="0" y1="0" x2="0" y2="7" stroke="#7a4f00" stroke-width="2.4"/></pattern>
  </defs>`;
const SCENE_CSS = `<style>
  .e.solid { stroke: #263a32; stroke-width: 2.2; }
  .e.dashed { stroke: #263a32; stroke-width: 2.6; stroke-dasharray: 9 5; }
  .e.hatched { stroke: url(#hatchWarn); stroke-width: 6; }
  .e.plain { stroke: #9aa49b; stroke-width: 1; }
  .lbl rect { fill: #f7f7f2; stroke: #c9d4c5; } .lbl text { fill: #263a32; font: 12px "DejaVu Sans", sans-serif; }
  </style>`;
// o.top, o.right: 'solid' | 'dashed' | 'hatched' for the two top edges (the front one is the textured stroke).
function scene(o = {}) {
  let s = DEFS;
  for (let x = -4; x <= 16; x += 2) s += `<polyline points="${pt(x, -4, 0)} ${pt(x, 12, 0)}" fill="none" stroke="#dfe2d9"/>`;
  for (let y = -4; y <= 12; y += 2) s += `<polyline points="${pt(-4, y, 0)} ${pt(16, y, 0)}" fill="none" stroke="#dfe2d9"/>`;
  s += face([[0, 0, 0], [10, 0, 0], [10, 7, 0], [0, 7, 0]], '#e6e6dc');
  s += face([[0, 7, 0], [10, 7, 0], [10, 7, 3], [0, 7, 3]], '#eceee7');
  s += face([[10, 0, 0], [10, 7, 0], [10, 7, 3], [10, 0, 3]], '#dcdfd6');
  s += face([[5.5, 7, 1], [7.5, 7, 1], [7.5, 7, 2.3], [5.5, 7, 2.3]], '#b6cbd6');
  s += face([[10, 2, 1], [10, 3.5, 1], [10, 3.5, 2.3], [10, 2, 2.3]], '#b6cbd6');
  s += edge([0, 7, 0], [10, 7, 0], 'solid') + edge([10, 7, 0], [10, 0, 0], 'solid') + edge([10, 7, 0], [10, 7, 3], 'solid');
  s += edge([0, 7, 3], [10, 7, 3], o.front || 'solid') + edge([10, 0, 3], [10, 7, 3], o.right || 'solid');
  s += edge([0, 0, 0], [0, 7, 0], 'plain') + edge([0, 0, 3], [0, 7, 3], 'plain') + edge([0, 0, 0], [0, 0, 3], 'plain');
  return `<svg class="scene" viewBox="0 0 938 728" preserveAspectRatio="xMidYMid meet">${SCENE_CSS}${s}</svg>`;
}

// ---------- Chrome ----------
const menubar = open => `<div class="menubar">${['<u>F</u>ile', '<u>E</u>dit', '<u>V</u>iew', '<u>C</u>amera', '<u>D</u>raw', '<u>T</u>errain', '<u>H</u>elp']
  .map((m, n) => `<span class="${n === open ? 'open' : ''}">${m}</span>`).join('')}</div>`;
const header = (name, state) => `<div class="header"><span class="wordmark">SKETCHYUP</span><span class="seg"><span class="on">Model</span><span>Sheets</span></span>
  <span class="doc">${name} &nbsp;·&nbsp; <i>${state}</i></span><span class="cmd">Commands &nbsp;Ctrl+K</span></div>`;
const RAIL = ['Select', 'Paint', 'Line', 'Rect', 'Circle', 'Push/pull', 'Offset', 'Move', 'Rotate', 'Tape'];
const rail = `<nav class="rail">${RAIL.map((t, n) => `<span class="${n === 0 ? 'on' : ''}">${t}</span>`).join('')}</nav>`;
const status = (msg, extra = '') => `<div class="status"><span class="msg">${msg}</span>${extra}<span class="meas">Measurements · m<span class="box">distance</span></span></div>`;
const side = (sum, tab, panel) => `<aside class="side"><div class="caps">MODEL</div><div class="selsum">${sum}</div>
  <div class="tabs"><span class="${tab === 'Outliner' ? 'on' : ''}">Outliner</span><span class="${tab === 'Materials' ? 'on' : ''}">Materials</span><span class="${tab === 'Styles' ? 'on' : ''}">Styles</span><span class="${tab === 'Components' ? 'on' : ''}">Components</span><span>›</span></div>
  <div class="panel">${panel}</div></aside>`;
const frame = (menuOpen, name, state, view, sidebar, stat, overlay = '') =>
  `<div class="frame">${menubar(menuOpen)}${header(name, state)}<main>${rail}<section class="viewport">${view}<div class="crumb">Model · Room</div></section><div class="splitter"></div>${sidebar}</main>${stat}${overlay}</div>`;
const dlg = (w, h, inner, o = {}) => `<div class="scrim" style="z-index:${o.z ?? 10}"></div><div class="dlg${o.tall ? ' tall' : ''}" role="dialog" aria-modal="true" aria-label="${o.name || ''}" style="z-index:${(o.z ?? 10) + 1};width:${w}px;height:${h}px;left:${(1280 - w) / 2}px;top:${o.top ?? (860 - h) / 2}px">${inner}</div>`;
const head = (title, sub, pill = '') => `<div class="dh"><div class="dt">${title}${pill}</div><div class="ds">${sub}</div></div>`;
const banner = (kind, key, html) => `<div class="dbn ${kind}" role="${kind === 'fail' ? 'alert' : 'status'}"><span class="k">${key}</span><span>${html}</span></div>`;
const foot = (st, buttons) => `<div class="df"><span class="st">${st}</span>${buttons}</div>`;
const btn = (t, c = '') => `<span class="btn ${c}" role="button">${t}</span>`;
const dfld = (label, html) => `<div class="dfld"><label>${label}</label><span>${html}</span></div>`;
const tip = (x, y, html) => `<div class="tip" style="left:${x}px;top:${y}px" role="tooltip">${html}</div>`;
const ptr = (x, y) => `<svg class="cursor" style="left:${x}px;top:${y}px" viewBox="0 0 16 22"><path d="M1 1l0 17 4.4-4 3 6.4 2.6-1.2-3-6.2 5.6-.4z" fill="#263a32" stroke="#f7f7f2" stroke-width="1.2"/></svg>`;

// The Styles tab (R062) with the two new sections. o.tex: the Texture field's state; o.on: edge stroke on.
function stylesPanel(o = {}) {
  const tex = o.tex || 'missing';
  const texField = tex === 'missing'
    ? `<span class="in dd wr wide">⚠ Edge texture 2 · Missing</span>`
    : tex === 'none' ? `<span class="in dd wide">None</span>` : `<span class="in dd wide">Edge texture 1</span>`;
  return `<section class="sec"><h3>Display</h3><div class="body">
      <div class="fld"><label>Display mode</label><span class="in dd wide">Textured</span></div>
      <div class="checks"><span class="cb on">Edges</span><span class="cb on">Profiles</span><span class="cb on">Grid</span><span class="cb on">Axes</span><span class="cb">Ground</span></div>
      <div class="btnrow">${btn('Colors and details…')}${btn('Reset model style')}</div></div></section>
    <section class="sec"><h3>Edge stroke<span class="n">On</span></h3><div class="body">
      <div class="cb on">Use an edge stroke</div>
      <div class="fld"><label>Width</label><span><span class="in">2.0 px</span> <span class="sfx">1 to 8</span></span></div>
      <div class="fld"><label>Opacity</label><span><span class="in">60 %</span> <span class="sfx">1 to 100</span></span></div>
      <div class="fld"><label>Dash</label><span class="in dd wide">Dashed</span></div>
      <div class="fld"><label>Texture</label>${texField}</div>
      <div class="cap">Missing: front edges draw hatched.</div>
      <div class="cap">Saved in schema 31. SketchyUp 1.3.0 cannot open it.</div></div></section>
    <section class="sec"><h3>Style library<span class="n">3 styles</span></h3><div class="body">
      <div class="fld"><label>Folder</label><span class="in wide" style="font-size:11px">…/SketchyUp/styles</span></div>
      <div class="btnrow">${btn('Choose folder…')}${btn('Refresh')}</div>
      <div class="lib">
        <div class="row sel"><svg class="sample" viewBox="0 0 52 16"><line x1="2" y1="8" x2="50" y2="8" stroke="#263a32" stroke-width="2.6" stroke-dasharray="9 5"/></svg><div>Style A<small>Dashed · 60 % · texture stored <span class="ok">✓ Stored</span></small></div></div>
        <div class="row"><svg class="sample" viewBox="0 0 52 16"><line x1="2" y1="8" x2="50" y2="8" stroke="#263a32" stroke-width="2.2"/></svg><div>Style B<small>Solid · 100 % · no texture <span class="ok">✓ Stored</span></small></div></div>
        <div class="row"><svg class="sample" viewBox="0 0 52 16"><line x1="2" y1="8" x2="50" y2="8" stroke="#7a4f00" stroke-width="5" stroke-dasharray="6 3"/></svg><div>Style C<small><span class="wr">⚠ Texture missing from file</span> · cannot apply</small></div></div>
      </div>
      <div class="btnrow">${btn('Apply to model', 'primary')}${btn('Save to library…')}</div></div></section>`;
}
const libStatus = `<div class="status"></div>`;
const stylesSide = (tex, tab = 'Styles') => side('Room · edge stroke on', tab, stylesPanel({ tex }));

      <div class="rule"></div>
      <div class="dbody" style="flex:1">
        <div class="col" style="width:520px;padding:0;overflow:auto">${list}</div>
        <div class="col" style="flex:1;padding:0;overflow:auto">${details}</div></div>` +
      foot('<span class="bad">Insert is off:</span> “Chair” cannot be inserted. Deselect it to insert the other two.', btn('Open catalog file…') + btn('Cancel') + btn('Insert 3 entries', 'primary off'));
    return frame(-1, 'Room', 'Edited', scene(), side('Room', 'Components', `<section class="sec"><h3>Components<span class="n">Library</span></h3><div class="body"><div class="cap">The Components tab is unchanged. Catalog entries are inserted here, not from the library tab.</div></div></section>`),
      status('Asset catalogs'), dlg(1040, 700, inner, { name: 'Asset catalogs', tall: true }));
  },
};

SCREENS.report = {
  title: '10 · The missing-dependency report',
  note: 'Shown when an insert is refused. It accounts for every requested entry, as the IFC report does: <b>3 requested = 0 inserted + 2 refused + 1 not inserted</b>, so no entry is lost. Each refused entry names the dependency that is missing or mismatched, with its id, and the reason. Nothing is inserted, and the catalog file is unchanged. Use <i>Select the other entries</i> to insert again without the refused ones.',
  html: () => {
    const kv = (a, b, cls = '') => `<div class="kv"><span>${a}</span><span class="${cls}">${b}</span></div>`;
    const grp = (kind, label, n, open = true) => `<div class="tr g" role="treeitem" aria-expanded="${open}"><span class="tw">${open ? '▾' : '▸'}</span><span class="pill ${kind}">${kind === 'warn' ? 'Attention' : kind === 'fail' ? 'Refused' : 'Notice'}</span><span>${label}</span><span class="n">${n}</span></div>`;
    const it = (html, sel = false) => `<div class="tr d1${sel ? ' sel' : ''}" role="treeitem">${html}</div>`;
    const sub = html => `<div class="sub d1">${html}</div>`;
    const left = `<div class="hd">What was requested</div>
      ${kv('Entries requested', '3')}${kv('Inserted', '0')}${kv('Refused, with a reason', '2')}${kv('Not inserted (the request was refused as a whole)', '1')}
      <div class="hd">Every entry is accounted for</div>
      <div class="cap" style="margin:0">Each requested entry is exactly one of these:</div>
      <div class="acc" role="img" aria-label="3 requested: 0 inserted, 2 refused, 1 not inserted"><i class="a" style="width:0%"></i><i class="c" style="width:67%"></i><i class="b" style="width:33%"></i></div>
      <div class="legend2"><div><span class="sw a"></span><span>Inserted</span><b>0</b></div><div><span class="sw c"></span><span>Refused, with its reason</span><b>2</b></div><div><span class="sw b"></span><span>Not inserted, because the request was refused</span><b>1</b></div></div>
      <div class="kv" style="border-top:1px solid var(--border);margin-top:4px;padding-top:5px"><span><b>0 + 2 + 1 = 3</b></span><span class="ok">✓ balanced</span></div>
      <div class="hd">How it was checked</div>
      ${kv('Catalog', 'Office fittings 1.0.0')}${kv('Every entry hash', 'checked')}${kv('Every dependency', 'checked')}${kv('Insert placement', 'origin')}`;
    const tree = grp('warn', 'Needs your attention', '2') +
      it('<span class="tw">▾</span><span><b>Chair</b> · component · entry 3 — missing texture</span>', true) +
      sub('Asset <b>7 “Chair fabric”</b> is not in this catalog. A component needs every texture it names; the request is refused as a whole.<br><span class="btn">Select the other entries</span><span class="btn">Remove Chair from selection</span>') +
      it('<span class="tw">▾</span><span><b>Desk top</b> · material · entry 2 — tampered texture</span>') +
      sub('Asset <b>6</b> has bytes that do not match its recorded SHA-256. A matching name or size never substitutes an asset, so the material is refused.') +
      grp('info', 'Not inserted', '1') +
      it('<span class="tw">▸</span><span><b>Desk</b> · component · entry 1 — refused with the request</span>') +
      grp('info', 'Notices', '1') +
      it('<span class="tw">▸</span><span>Components are placed at the model’s origin. Templates are not inserted into a model.</span>');
    const inner = head('Asset catalog: nothing was inserted', '<span class="mono">Office fittings 1.0.0</span> · a request of 3 entries') +
      banner('fail', '✕ Nothing was inserted', 'Your model and the catalog file are unchanged. <b>Two entries have a missing or mismatched dependency.</b> Fix or deselect them, then insert again.') + '<div class="rule"></div>' +
      `<div class="dbody"><div class="col" style="width:380px;overflow:auto">${left}</div>
        <div class="col" style="flex:1;padding:14px 16px 14px 18px"><div class="tree" role="tree" aria-label="Asset catalog report: refused entries, their dependencies and notices">${tree}</div></div></div>` +
      foot('Row 1 of 7 · Enter expands · Ctrl+C copies the row', btn('Copy report') + btn('Save report…') + btn('Close', 'primary def'));
    return frame(-1, 'Room', 'Edited', scene(), side('Room', 'Components', `<section class="sec"><h3>Components<span class="n">Library</span></h3></section>`),
      status('Asset catalog: nothing was inserted'), dlg(1040, 660, inner, { name: 'Asset catalog report' }));
  },
};

SCREENS.viewport = {
  title: '11 · What the viewport draws with an edge stroke',
  note: 'An illustration of the R100.f rendering, which is not built yet. Front edges are <b>hatched</b> because their texture is missing: the hatch is the warning colour, and no plain colour or substitute texture is drawn in its place. Right edges are <b>dashed</b> as the stroke sets. The bottom edges are solid. The status bar carries the words. No label floats over the model (principle 1), so the report lives in the Styles tab and in the status bar chip.',
  html: () => frame(-1, 'Room', 'Edited', scene({ front: 'hatched', right: 'dashed' }), stylesSide('missing'),
    status('Room · Edge texture 2 is missing: its edges draw hatched until it is restored', '<span class="chip" role="button" aria-label="Edge texture missing. Show in Styles"><b>⚠</b> Edge texture missing · <span class="link">Show in Styles</span></span>')),
};

const ORDER = ['menu', 'styles', 'texture', 'import', 'refused', 'export', 'save', 'materials', 'catalog', 'report', 'viewport'];

// 200 % text: every text size is doubled, except inside the drawing. Each element that inherits its
// size from its parent keeps inheriting, so only elements with a size of their own are changed.
function scaleText() {
  // The tool rail is icons in the product (its names are tooltips), so its labels keep their size.
  const els = [document.body, ...document.body.querySelectorAll('*')].filter(e => !(e instanceof SVGElement) && !e.closest('.rail'));
  const size = new Map(els.map(e => [e, parseFloat(getComputedStyle(e).fontSize)]));
  const listed = new Set(els);
  for (const e of els) {
    const p = e.parentElement;
    if (e === document.body || !listed.has(p) || size.get(p) !== size.get(e)) e.style.fontSize = (size.get(e) * 2) + 'px';
  }
}

if (big) document.body.classList.add('t200');
if (one && SCREENS[one]) {
  document.body.className = 'one' + (big ? ' t200' : '');
  document.body.innerHTML = SCREENS[one].html();
} else {
  document.body.innerHTML = `<div class="gallery">` + ORDER.map(k => `<div><h2>${SCREENS[k].title}</h2><p>${SCREENS[k].note}</p>${SCREENS[k].html()}</div>`).join('') + '</div>';
}
if (big) scaleText();
})();
</script>
