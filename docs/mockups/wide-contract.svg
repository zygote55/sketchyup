<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<title>1600 logical pixel interaction contract: simultaneous Tray and Assistant</title>
<desc>Design reference, not a runtime screenshot. The assistant reconciles a lost commit response; Measurements remain visible.</desc>
<style>text{font-family:sans-serif;fill:#263a32;font-size:15px}.small{font-size:13px;fill:#617266}.bold{font-weight:bold}.line{stroke:#c9d4c5;fill:none}</style>
