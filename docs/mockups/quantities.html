<title>SketchyUp quantities and schedules mockups (R101.e)</title>
<!-- Static illustrations of docs/UX_DESIGN.md section 19, not application code.
     Open quantities.html for every screen, or quantities.html?screen=<name> for one 1280 x 860 frame:
     menu, totals, groups, filters, computing, save, schedules, run, stale, delete, store, exported, exists.
     Add &text=200 to any of them to double every text size: a check of wrapping and overlap, not a second design.
     At 200 % the Tray section scrolls, as the real panel does; the frame shows the top of it, and the schedule
     row or total that a screen is about is brought into view where it matters (stale, schedules).
     The model is the ADR 0175 section 11 fixture quantities-a with its corrected totals (40,259.20 m2 at precision 2,
     not the old 40,174.20). The drawing is an illustration only. Figures for the BoxP and Table rows, the visible
     totals and the Boxes tag come from the fixture's own rows (ADR 0175 sections 2, 11 and R101.a notes); the
     tag and folder names and the terrain name are invented, and each screen says what it derives. -->

<script>
(() => {
const q = new URLSearchParams(location.search);
if (q.get('text') === '200') document.documentElement.classList.add('t200');

// ---------- The model: the ADR 0175 section 11 fixture quantities-a (illustrative drawing) ----------
const S = 21, OX = 433, OY = 262;
const P = (x, y, z = 0) => [(x - y) * 0.866 * S + OX, (x + y) * 0.5 * S - z * S + OY];
const pt = (x, y, z) => P(x, y, z).map(n => n.toFixed(1)).join(',');
const poly = (a, fill, stroke = '#263a32', sw = 1) => `<polygon points="${a.map(p => pt(...p)).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round"/>`;
const rectFront = (x, w, z1, z2, y = 8) => [[x, y, z1], [x + w, y, z1], [x + w, y, z2], [x, y, z2]];
const rectRight = (y, w, z1, z2, x = 12) => [[x, y, z1], [x, y + w, z1], [x, y + w, z2], [x, y, z2]];
function scene() {
  let s = '';
  for (let x = -4; x <= 18; x += 2) s += `<polyline points="${pt(x, -4, 0)} ${pt(x, 14, 0)}" fill="none" stroke="#dfe2d9"/>`;
  for (let y = -4; y <= 14; y += 2) s += `<polyline points="${pt(-4, y, 0)} ${pt(18, y, 0)}" fill="none" stroke="#dfe2d9"/>`;
  s += poly([[0, 0, 0], [12, 0, 0], [12, 8, 0], [0, 8, 0]], '#e6e6dc', '#9aa49b');
  s += poly([[12, 0, 0], [12, 8, 0], [12, 8, 3], [12, 0, 3]], '#dcdfd6');
  s += poly([[0, 8, 0], [12, 8, 0], [12, 8, 3], [0, 8, 3]], '#eceee7');
  for (const x of [1.0, 4.6, 10.0]) s += poly(rectFront(x, 1.4, 1, 2.2), '#b6cbd6');
  for (const y of [1.2, 5.2]) s += poly(rectRight(y, 1.4, 1, 2.2), '#b6cbd6');
  s += poly(rectFront(7.8, 1.0, 0, 2.1), '#c9bfae');
  s += poly([[12.5, -0.5, 3], [12.5, 8.5, 3], [12.5, 8.5, 3.3], [12.5, -0.5, 3.3]], '#d2d5ca');
  s += poly([[-0.5, 8.5, 3], [12.5, 8.5, 3], [12.5, 8.5, 3.3], [-0.5, 8.5, 3.3]], '#e0e2d8');
  s += poly([[-0.5, -0.5, 3.3], [12.5, -0.5, 3.3], [12.5, 8.5, 3.3], [-0.5, 8.5, 3.3]], '#fbfbf8');
  return `<svg class="scene" viewBox="0 0 938 728" preserveAspectRatio="xMidYMid meet">${s}</svg>`;
}

    return frame(-1, 'Edited', side(SCHEDULES({ stale: true }), {}), status('Delete a saved schedule'), dlg(460, inner, 'Delete the schedule'));
  },
};

SCREENS.store = {
  title: '11 · The schedule file cannot be read: the rest still works',
  note: 'If the user-level schedule file is damaged, too large or not a file SketchyUp can use, the schedules part of the section says so (red, with ✕), with the file\'s location and the place of the fault (ADR section 7 refusals, "Corrupt or oversized store"). SketchyUp never resets or rewrites that file, so the text tells the person to move it aside to start again. Everything else still works: the live totals, the groups, the invalid list and exports, because a damaged optional store must not stop the model\'s own numbers (principle 5).',
  html: () => {
    const body = `<div class="qsch"><div class="qhd"><b>Saved schedules</b><span class="sfxs">cannot be read</span></div>
      <div class="srow stale" style="border-color:var(--fail);background:var(--fail-bg)"><span class="sname bad">✕ Schedules cannot be read</span>
        <span class="smeta">The file is not valid JSON.<br><span class="mono">…/SketchyUp/SketchyUp/report-schedules.json</span><br>Fault: at byte 214 (the file is not changed or reset).</span>
        <div class="sref" style="border-top-color:var(--fail)">Totals, groups and exports still work. SketchyUp never resets this file: move it aside yourself, then reopen this model to start again.<div style="margin-top:4px">${btn('Show details', 'small')}</div></div></div>
      <div class="qact">${btn('Export CSV…')}${btn('Export JSON…')}</div></div>`;
    return frame(-1, 'Edited', side(TOT.all ? totals('all', { scope: 'precision 2' }) + body : body, {}), status('Schedules cannot be read · the totals are unaffected'));
  },
};

SCREENS.exported = {
  title: '12 · After an export: the written report',
  note: 'The export report is the report sheet of UX 6.4, with the same two-column layout as the import and export reports of IFC (UX 16.5 and 16.8). The banner says what was written and that the model is unchanged. The left column records how the file was made (grouping, metrics, hidden content, precision, units, revision, and whether a schedule made it: here none). The right column lists, under <b>Needs your attention</b>, the two bodies with no volume and their status words, since the file carries them in its invalid rows. <b>Terrain</b> is named as not a solid. The CSV is UTF-8 with LF line endings and no BOM (ADR section 6.1).',
  html: () => {
    const rep = `<div class="col" style="width:340px">
        <div class="hd">What was written</div>
        ${kv('Group by', 'Definition')}${kv('Metrics', 'all tables')}${kv('Hidden content', 'Included')}${kv('Precision', '2 (document)')}
        ${kv('Units', 'm, m², m³')}${kv('Revision', '214')}${kv('Schedule', 'none (ad hoc)')}${kv('Encoding', 'UTF-8, LF, no BOM')}
        <div class="hd">The model</div>
        <div class="cap" style="margin:0">Unchanged. The report reads the model and writes a new file; nothing was saved to the model.</div>
      </div>
      <div class="col" style="flex:1;padding:12px 16px 12px 18px"><div class="tree" role="tree" aria-label="Export report: items that need attention and notices">
        <div class="tr g" role="treeitem" aria-expanded="true"><span class="tw">▾</span><span class="pill warn">Attention</span><span>Not solids</span><span class="n">2</span></div>
        <div class="tr d1 sel" role="treeitem"><span class="tw">▾</span><span><b>⚠ Not a solid: open boundary</b> · 1 body</span></div>
        <div class="sub d1">The open plate. Its area (2.00 m²) is written; it has no volume in the file.<br>${btn('Select in model', 'small')}</div>
        <div class="tr d1" role="treeitem"><span class="tw">▸</span><span><b>⚠ Not a solid: non-manifold boundary</b> · 1 body</span></div>
        <div class="tr g" role="treeitem" aria-expanded="true"><span class="tw">▾</span><span class="pill info">Notice</span><span>Notices</span><span class="n">1</span></div>
        <div class="tr d1" role="treeitem"><span class="tw">▸</span><span>Terrain is not a solid: its area is written, with no volume. <span class="sfxs">× 1</span></span></div>
        <div class="tr g" role="treeitem" aria-expanded="false"><span class="tw">▸</span><span class="pill ok">Info</span><span>Settings and limits used</span><span class="n"></span></div>
      </div></div>`;
    const inner = head('Quantities written', `<span class="mono">quantities-a-takeoff.csv</span> · CSV · revision 214`) +
      banner('ok', '✓ Written', 'The file was written as a new file. <b>The model is unchanged.</b> Two bodies have no volume; their areas are counted.') +
      '<div class="rule"></div>' + `<div class="dbody">${rep}</div>` +
      foot('Esc closes.', btn('Copy path') + btn('Close', 'primary def'));
    return frame(-1, 'Edited', side(filters({ group: 'Definition' }) + totals('all', { scope: 'precision 2' }), {}), status('Quantities written · the model is unchanged'), dlg(980, inner, 'Quantities written'));
  },
};

SCREENS.exists = {
  title: '13 · Refused: the file already exists',
  note: 'The Save dialog for an export does not ask to replace a file: it is opened without the overwrite prompt, as for the IFC and DXF exports (UX 16.8), because a report is never written over an existing file (ADR section 6.1; the engine refuses it as FILE_EXISTS and nothing is written). The sheet says first that <b>nothing was written</b>, then the name and the rule, then numbered next steps, in the refusal shape of UX 16.6. The sheet has the same red ✕ as the other refusals and never relies on colour alone.',
  html: () => {
    const inner = head('Quantities not written', `<span class="mono">quantities-a-takeoff.csv</span>`, '<span class="pill fail" style="font-size:1rem">Refused</span>') +
      banner('fail', '✕ Nothing was written', 'The model is unchanged. A file with that name already exists in this folder.') + '<div class="rule"></div>' +
      `<div class="col" style="padding-top:10px">
        <div style="font-weight:700;margin-bottom:4px">An existing file is never replaced.</div>
        ${kv('Requested', '<span class="mono">quantities-a-takeoff.csv</span>')}
        ${kv('Existing file', 'kept, unchanged')}
        <div class="hd">What to do next</div>
        <ol class="steps"><li>Choose a new name in the Save dialog. It does not ask to replace files.</li>
          <li>Or move the existing file aside yourself, then export again.</li></ol>
      </div>` +
      foot('Esc closes.', btn('Copy details') + btn('Export to another name…') + btn('Close', 'primary def'));
    return frame(-1, 'Edited', side(totals('all', { scope: 'precision 2' }) + ACTIONS, {}), status('Export refused: nothing was written'), dlg(640, inner, 'Quantities not written'));
  },
};

const ORDER = ['menu', 'totals', 'groups', 'filters', 'computing', 'save', 'schedules', 'run', 'stale', 'delete', 'store', 'exported', 'exists'];
const one = q.get('screen');
if (one && SCREENS[one]) { document.body.className = 'one'; document.body.innerHTML = SCREENS[one].html(); }
else document.body.innerHTML = `<div class="gallery">` + ORDER.map(k => `<div><h2>${SCREENS[k].title}</h2><p>${SCREENS[k].note}</p>${SCREENS[k].html()}</div>`).join('') + '</div>';
})();
</script>
</body>
</html>
