<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SketchyUp presentation batch mockups (UX_DESIGN section 17)</title>
<!-- Static illustrations of docs/UX_DESIGN.md section 17, not application code.
     Open presentation.html for every screen, or presentation.html?screen=<name> for one 1280 x 860 frame:
     menu, render, paths, pick, limit, presets, batch, device, video, unavailable, running, resume, results, broken.
     Add &text=200 to any of them to double every text size: a check of wrapping and overlap, not a second design.
     Colours are the light theme of src/app/theme.hpp, as in ifc.html. The example is invented: a house with five
     saved scenes (Front, Entrance, Side, Garden, Roof), a path "Tour" and two presets. Planned frames, output
     ceilings and free-space figures are computed with the engine's formulas (camera_motion.cpp,
     presentation_records.cpp, presentation_batch.cpp); they are not measurements. Engine wording is quoted from
     the R099.a to R099.c code. -->
<style>
:root {
  --surface: #f7f7f2; --ink: #263a32; --border: #c9d4c5; --selected: #dce7dc; --hover: #e6ebdf;
  --input: #ffffff; --accent: #547858; --muted: #617266; --canvas: #f0f1ec;
  --sel: #5b5bd6; --warn: #7a4f00; --warn-bg: #fdf3dc; --warn-line: #e3b75c;
  --fail: #a8322b; --fail-bg: #fbf1f0; --info: #2c5aa0; --info-bg: #eef3fb; --ok: #547858; --ok-bg: #dce7dc;
}
* { box-sizing: border-box; }
body { margin: 0; background: #d9dcd3; font: 12px/1.35 "DejaVu Sans", "Noto Sans", "Liberation Sans", sans-serif; color: var(--ink); font-variant-numeric: tabular-nums; }
body.one { background: var(--surface); }
.gallery { padding: 24px; display: flex; flex-direction: column; gap: 28px; align-items: center; }
.gallery h2 { margin: 0 0 6px; font-size: 15px; }
.gallery p { margin: 0 0 10px; max-width: 1280px; color: #3d4a42; }
.frame { width: 1280px; height: 860px; position: relative; overflow: hidden; background: var(--surface); box-shadow: 0 4px 24px rgba(0,0,0,.18); display: grid; grid-template-rows: 34px 48px 1fr 50px; }
kbd { font: inherit; font-size: 11px; padding: 0 4px; border: 1px solid var(--border); border-radius: 3px; background: var(--input); color: var(--muted); }
u { text-decoration: underline; }

/* Application chrome (as ifc.html) */
.menubar { display: flex; align-items: center; gap: 4px; padding: 0 12px; border-bottom: 1px solid var(--border); }
.menubar span { padding: 4px 9px; border-radius: 4px; }
.menubar span.open { background: var(--selected); }
.header { display: flex; align-items: center; gap: 10px; padding: 0 9px 0 25px; border-bottom: 1px solid var(--border); }
.wordmark { font-weight: 700; letter-spacing: 2.4px; font-size: 12px; margin-right: 12px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; background: var(--input); }
.seg span { padding: 3px 14px; border-left: 1px solid var(--border); white-space: nowrap; }
.seg span:first-child { border-left: 0; }
.seg span.on { background: var(--accent); color: #fff; font-weight: 700; }
.doc i { font-style: normal; color: var(--muted); }
.cmd { margin-left: auto; border: 1px solid var(--border); border-radius: 5px; padding: 6px 11px; background: var(--input); }

<body>
<script>
(() => {
const f1 = n => n.toFixed(1);
const MiB = 1024 * 1024, GiB = 1024 * MiB;
// The engine's per-frame bound (presentation_batch.cpp frameBudget): the PNG bound plus the 1 MiB metadata cap.
const frameBound = (w, h) => Math.min(64, (w * h * 5) / MiB + 1) + 1;
// The planned frame count (presentation_records.cpp cameraPathFrameCount): 1 + N x hold + (N - 1) x transition.
const planned = (n, hold, tr) => 1 + n * hold + (n - 1) * tr;
const FPS = 24, TR = 24, HOLD = 12;             // 1.00 s transition, 0.50 s hold at 24 frames per second
const TOUR = 5, TOUR_FRAMES = planned(TOUR, HOLD, TR); // 157
const FINAL = { w: 1280, h: 720, eng: 'Cycles', samples: 128 }, DRAFT = { w: 640, h: 360, eng: 'Cycles', samples: 16 };
const BATCH_FRAMES = TOUR_FRAMES * 2;
const CEIL = (TOUR_FRAMES * frameBound(FINAL.w, FINAL.h) + TOUR_FRAMES * frameBound(DRAFT.w, DRAFT.h)); // MiB
const CEIL_TXT = (CEIL / 1024).toFixed(2) + ' GiB';
const CEIL_VIDEO_TXT = (Math.min(2 * CEIL, 2048) / 1024).toFixed(1) + ' GiB';
const NEED_MIB = Math.round(Math.min(CEIL, 2048) + 1 + 256);   // ceiling + capture (about 1 MiB) + 256 MiB reserve
// The model behind the dialogs: a small isometric house (viewport 938 x 728).
const S = 21, OX = 433, OY = 262;
const P = (x, y, z = 0) => [(x - y) * 0.866 * S + OX, (x + y) * 0.5 * S - z * S + OY];
const pt = (x, y, z) => P(x, y, z).map(f1).join(',');
const poly = (a, fill, stroke = '#263a32', sw = 1, extra = '') => `<polygon points="${a.map(p => pt(...p)).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" stroke-linejoin="round" ${extra}/>`;
const rectFront = (x, w, z1, z2, y = 8) => [[x, y, z1], [x + w, y, z1], [x + w, y, z2], [x, y, z2]];
const rectRight = (y, w, z1, z2, x = 12) => [[x, y, z1], [x, y + w, z1], [x, y + w, z2], [x, y, z2]];
// The five keyframes of Tour, in playing order, at their real positions around the house.
const KEYS = [[-2.5, -2.5, 1.6], [6, -3.5, 1.6], [14, 3, 1.6], [9, 12, 1.6], [3, 12, 4.8]];
function scene(o = {}) {
  let s = '';
  for (let x = -4; x <= 18; x += 2) s += `<polyline points="${pt(x, -4, 0)} ${pt(x, 14, 0)}" fill="none" stroke="#dfe2d9"/>`;
  for (let y = -4; y <= 14; y += 2) s += `<polyline points="${pt(-4, y, 0)} ${pt(18, y, 0)}" fill="none" stroke="#dfe2d9"/>`;
  s += poly([[0, 0, 0], [12, 0, 0], [12, 8, 0], [0, 8, 0]], '#e6e6dc', '#9aa49b');
  s += poly([[12, 0, 0], [12, 8, 0], [12, 8, 3], [12, 0, 3]], '#dcdfd6');
  s += poly([[0, 8, 0], [12, 8, 0], [12, 8, 3], [0, 8, 3]], '#eceee7');
  for (const x of [1.0, 4.6, 10.0]) s += poly(rectFront(x, 1.4, 1, 2.2), '#b6cbd6');
  for (const y of [1.2, 5.2]) s += poly(rectRight(y, 1.4, 1, 2.2), '#b6cbd6');
  s += poly(rectFront(7.8, 1.0, 0, 2.1), '#c9bfae');
  s += poly([[12.5, -0.5, 3], [12.5, 8.5, 3], [12.5, 8.5, 3.3], [12.5, -0.5, 3.3]], '#d2d5ca');
  s += poly([[-0.5, 8.5, 3], [12.5, 8.5, 3], [12.5, 8.5, 3.3], [-0.5, 8.5, 3.3]], '#e0e2d8');
  s += poly([[-0.5, -0.5, 3.3], [12.5, -0.5, 3.3], [12.5, 8.5, 3.3], [-0.5, 8.5, 3.3]], '#fbfbf8');
  if (o.path) {
    const pts = KEYS.map(k => P(...k).map(f1).join(',')).join(' ');
    s += `<polyline points="${pts}" fill="none" stroke="#5b5bd6" stroke-width="2" stroke-dasharray="7 5"/>`;
    KEYS.forEach((k, i) => {
      const [cx, cy] = P(...k);
      s += `<g class="kfm"><circle cx="${f1(cx)}" cy="${f1(cy)}" r="11" fill="#ffffff" stroke="#5b5bd6" stroke-width="1.5"/><text x="${f1(cx)}" y="${f1(cy + 4)}" text-anchor="middle" font-size="11" font-weight="700" fill="#263a32">${i + 1}</text></g>`;
    });
  }
  return `<svg class="scene" viewBox="0 0 938 728" preserveAspectRatio="xMidYMid meet"><style>
    .kfm text { font-family: "DejaVu Sans", sans-serif; }</style>${s}</svg>`;
}

// ---------- Chrome ----------
const MENUS = ['<u>F</u>ile', '<u>E</u>dit', '<u>D</u>raw', '<u>T</u>errain', '<u>C</u>amera', 'E<u>x</u>tensions', '<u>V</u>iew'];
const menubar = open => `<div class="menubar">${MENUS.map((m, n) => `<span class="${n === open ? 'open' : ''}">${m}</span>`).join('')}</div>`;
const header = (name, state) => `<div class="header"><span class="wordmark">SKETCHYUP</span><span class="seg"><span class="on">Model</span><span>Sheets</span></span>
  <span class="doc">${name} &nbsp;·&nbsp; <i>${state}</i></span><span class="cmd">Commands &nbsp;Ctrl+K</span></div>`;
const RAIL = ['Select', 'Paint', 'Line', 'Rect', 'Circle', 'Push/pull', 'Offset', 'Follow', 'Intersect', 'Solids', 'Orient', 'Move', 'Rotate', 'Scale', 'Tape'];
const rail = `<nav class="rail">${RAIL.map((t, n) => `<span class="${n === 0 ? 'on' : ''}">${t}</span>`).join('')}<span class="grp">Terrain ▸</span></nav>`;
const status = (msg, extra = '') => `<div class="status"><span class="msg">${msg}</span>${extra}<span class="meas">Measurements · m<span class="box">distance</span></span></div>`;
const side = (sum, tab, panel) => `<aside class="side"><div class="caps">MODEL</div><div class="selsum">${sum}</div>
  <div class="tabs"><span class="${tab === 'Outliner' ? 'on' : ''}">Outliner</span><span class="${tab === 'Tags' ? 'on' : ''}">Tags</span><span class="${tab === 'Info' ? 'on' : ''}">Info</span><span>M ‹ ›</span></div><div class="panel">${panel}</div>
  <div class="hint2">Middle drag: orbit<br>Right drag: pan · Wheel: zoom</div></aside>`;
const outliner = items => items.map(([d, n, k]) => `<div class="trow" style="padding-left:${11 + d * 14}px"><span>${d === 0 ? '▾ ' : ''}${n}</span><span class="c">${k}</span><span></span></div>`).join('');
const OUT_HOUSE = outliner([[0, 'House', 'Group'], [1, 'Walls', 'Group'], [1, 'Roof', 'Group'], [1, 'Windows', 'Group'], [1, 'Door', 'Component']]);
const frame = (menuOpen, name, state, view, sidebar, stat, overlay = '') =>
  `<div class="frame">${menubar(menuOpen)}${header(name, state)}<main>${rail}<section class="viewport">${view}<div class="crumb">Model</div></section><div class="splitter"></div>${sidebar}</main>${stat}${overlay}</div>`;
const dlg = (w, h, inner, o = {}) => `<div class="scrim" style="z-index:${o.z ?? 10};${o.light ? 'background:rgba(38,58,50,.2)' : ''}"></div><div class="dlg" role="dialog" aria-modal="${o.modal === false ? 'false' : 'true'}" ${o.name ? `aria-label="${o.name}"` : ''} style="z-index:${(o.z ?? 10) + 1};width:${w}px;height:${h}px;left:${(1280 - w) / 2}px;top:${o.top ?? (860 - h) / 2}px">${inner}</div>`;
const head = (title, sub, pill = '') => `<div class="dh"><div class="dt">${title}${pill}</div><div class="ds">${sub}</div></div>`;
const banner = (kind, key, html) => `<div class="dbn ${kind}" role="${kind === 'fail' ? 'alert' : 'status'}"><span class="k">${key}</span><span>${html}</span></div>`;
const foot = (st, buttons) => `<div class="df"><span class="st">${st}</span>${buttons}</div>`;
const btn = (t, c = '') => `<span class="btn ${c}" role="button">${t}</span>`;
const ck = (t, on, off = false) => `<div class="ck${on ? ' on' : ''}${off ? ' off' : ''}" role="checkbox" aria-checked="${!!on}"${off ? ' aria-disabled="true"' : ''}>${t}</div>`;
const rb = (t, on, off = false) => `<div class="rb${on ? ' on' : ''}${off ? ' off' : ''}" role="radio" aria-checked="${!!on}">${t}</div>`;
const fld = (label, html, cls = '') => `<div class="fld ${cls}"><label>${label}</label><span>${html}</span></div>`;
const hint = t => `<div class="cap">${t}</div>`;
const engine = t => `<div class="codebox mono">${t}</div>`;

// Presentations dialog: the two tabs of the owner-facing editor (17.2, 17.3)
function presDialog(tab, body, footer, o = {}) {
  const tabs = `<div class="dtabs" role="tablist"><span role="tab" aria-selected="${tab === 0}" class="${tab === 0 ? 'on' : ''}">Camera paths</span><span role="tab" aria-selected="${tab === 1}" class="${tab === 1 ? 'on' : ''}">Render presets</span></div>`;
  const inner = head('Presentations', 'Camera paths and render presets for this model. Each change is one undo step; the model stays open behind this window.') + tabs + body + footer;
  return dlg(o.w ?? 1100, o.h ?? 740, inner, { name: 'Presentations', top: o.top ?? 50, z: o.z });
}
const pathItem = (name, sub, o = {}) => `<div class="it${o.sel ? ' sel' : ''}${o.bad ? ' bad' : ''}" role="option" aria-selected="${!!o.sel}"><span><b>${name}</b><br><span class="sub">${sub}</span></span><span class="sfx">${o.tag || ''}</span></div>`;
const kfRows = (rows) => `<div class="kfl" role="list" aria-label="Keyframes, in playing order">${rows.map((k, i) => `<div class="kf${k.cls ? ' ' + k.cls : ''}" role="listitem" aria-label="${k.aria || ''}"><span class="pos">${i + 1}</span><span>${k.name}</span><span class="st">${k.st}</span></div>`).join('')}</div>`;
const timingRows = (fps, tr, hold, bad = false) => `
  ${fld('Frames per second', `<span class="in" style="min-width:70px">${fps}</span> <span class="sfx">1 to 60</span>`)}
  ${fld('Transition between scenes', `<span class="in" style="min-width:90px">${f1(tr)} s</span> <span class="sfx">= ${Math.max(1, Math.round(tr * fps))} steps · 0.05 to 10 s</span>`)}
  ${fld('Hold each scene', `<span class="in" style="min-width:90px">${f1(hold)} s</span> <span class="sfx">= ${Math.round(hold * fps)} steps · 0 to 5 s</span>`)}`;
const liveLine = (n, frames, fps, cls = 'ok', extra = '') => `<div class="dbn ${cls}" style="margin:8px 0 0" role="status"><span class="k">${cls === 'fail' ? '✕ Too long' : '✓ Plans'}</span><span>${frames} of 240 frames · ${n} scenes · ${f1(frames / fps)} s at ${fps} fps. ${extra}</span></div>`;
const pathsEditorSaved = `
  <div class="ed">
    ${fld('Name', `<span class="in" style="min-width:220px">Tour</span> <span class="sfx">unique · up to 1024 bytes</span>`)}
    <div class="hd" style="margin-top:6px">Keyframes <span class="sfx">(scenes play in this order; a scene may repeat)</span></div>
    ${kfRows([{ name: 'Front', st: 'camera' }, { name: 'Entrance', st: 'camera' }, { name: 'Side', st: 'camera' }, { name: 'Garden', st: 'camera' }, { name: 'Roof', st: 'camera', aria: 'Keyframe 5 of 5, Roof, has a camera' }])}
    <div class="btnrow"><span class="btn" role="button">Add scene…</span><span class="btn" role="button">Move earlier</span><span class="btn" role="button">Move later</span><span class="btn" role="button">Remove</span><span class="sfx">Alt+↑ / Alt+↓ move · Delete removes</span></div>
    <div class="hd">Timing</div>
    ${timingRows(FPS, 1, 0.5)}
    ${liveLine(TOUR, TOUR_FRAMES, FPS, 'ok', 'At this timing, up to <b>7</b> scenes fit in 240 frames.')}
    <div class="cap" style="margin-top:6px">A pan takes the shorter turn. For a longer turn, add a scene between the two. A switch between perspective and orthographic is a cut at its keyframe.</div>
  </div>`;

      <div class="hd">Output</div>

  const cost = `<div class="col" style="flex:1">
      <div class="hd">What the batch will do</div>
      <div class="budget"><div class="l">Frames</div><div class="bigv">${BATCH_FRAMES}</div><div class="sfx">${TOUR_FRAMES} frames × 2 presets</div></div>
      <div class="budget"><div class="l">Output, at most</div><div class="bigv">${off ? '—' : CEIL_TXT}</div><div class="sfx">${noVideo || off ? 'Largest possible; real frames are usually smaller. The batch stops at 2.0 GiB.' : `Largest possible; real frames are usually smaller. With video: ${CEIL_VIDEO_TXT}, the budget caps it.`}</div></div>
      <div class="budget"><div class="l">Free space on this disk</div><div class="bigv">${off ? '—' : '812 GiB'}</div><div class="sfx">${off ? '' : `Enough: the batch needs about ${(NEED_MIB / 1024).toFixed(1)} GiB, with a 256 MiB reserve.`}</div></div>
      <div class="budget"><div class="l">Time</div><div class="sfx">Not estimated. Each frame is a separate Blender render. In R099.b's measurement a 1024 × 768 frame at 32 samples took about 26 s on CPU.</div></div>
      ${off ? `<div class="setup" role="region" aria-label="Blender is needed">
          <div class="hd" style="margin-top:0">Blender is needed for presentation batches</div>
          <div>Presentation batches render each frame with Blender 5.2 LTS and encode video with its FFmpeg. Renders and the one-shot export use the same Blender.</div>
          <div class="kvl" style="margin-top:6px"><span>Detected</span><span class="bad">Not found on PATH</span></div>
          <div class="btnrow" style="margin-top:6px">${btn('Choose executable…')}${btn('Check again')}</div>
          <div class="cap">On Arch, install the blender package, then check again.</div></div>`
        : `<div class="budget"><div class="l">Blender</div><div>${noVideo ? '<span class="ok">✓</span> Blender 5.2.2 · CPU device ready' : '<span class="ok">✓</span> Blender 5.2.2 · CPU device ready'}</div><div class="sfx">${noVideo ? 'Video: unavailable here (H.264 missing).' : 'Video: H.264 available.'}</div></div>`}
    </div>`;
  let st = 'Start checks Blender again, then renders. The batch works from a copy of the model as it is now: no save prompt.';
  if (off) st = 'Start is unavailable until Blender 5.2 LTS is found. Your model is not changed.';
  if (conflict) st = 'Start is unavailable: Preview and CPU do not match. Nothing is rendered.';
  if (noVideo) st = 'Video is unavailable on this Blender. Start renders the frames only.';
  const startBtn = off || conflict ? btn('Start batch', 'primary off') : btn('Start batch', 'primary def');
  const inner = head('Export presentation batch', 'Renders one image sequence per preset along a camera path, into a new folder. The model is not changed.') +
    `<div class="rule"></div><div class="dbody" style="flex:1">${left}${cost}</div>` + foot(st, btn('Cancel') + startBtn);
  return dlg(1040, 740, inner, { name: 'Export presentation batch', top: 30 });
}

// ---------- Gallery and single-screen switch ----------
const ORDER = ['menu', 'render', 'paths', 'pick', 'limit', 'presets', 'batch', 'device', 'video', 'unavailable', 'running', 'resume', 'results', 'broken'];
const params = new URLSearchParams(location.search);
const one = params.get('screen');
if (one && SCREENS[one]) { document.body.className = 'one'; document.body.innerHTML = SCREENS[one].html(); }
else document.body.innerHTML = `<div class="gallery">` + ORDER.map(k => `<div><h2>${SCREENS[k].title}</h2><p>${SCREENS[k].note}</p>${SCREENS[k].html()}</div>`).join('') + '</div>';
// ?text=200: double every font size, then let the frames grow (x2 CSS), to check wrapping and overlap.
if (params.get('text') === '200') {
  const els = [...document.querySelectorAll('body *')];
  const sizes = els.map(e => parseFloat(getComputedStyle(e).fontSize));
  els.forEach((e, i) => { if (e.closest('svg') === null) e.style.fontSize = (sizes[i] * 2) + 'px'; });
  document.body.classList.add('x2');
}
})();
